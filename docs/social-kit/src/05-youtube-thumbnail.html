<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#08090a;color:#d0d6e0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-0.011em}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(208,214,224,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(208,214,224,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 20%,transparent 80%)}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.12em;color:#62666d}
.accent{color:#f3d58b}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:56px;height:56px}
.brand span{font-weight:600;letter-spacing:-0.02em;color:#ffffff}
.card{background:#0f1011;border:1px solid #23252a;border-radius:0px}
.pill{display:inline-block;border:1px solid #383b3f;border-radius:999px;color:#d0d6e0}
</style></head>
<body><div class="grid"></div><div style="position:absolute;left:80px;top:80px;right:80px;bottom:80px;display:flex;flex-direction:column;justify-content:space-between"><div class="eyebrow" style="font-size:24px">Walkthrough</div><div style="font-size:104px;font-weight:600;line-height:1.02;letter-spacing:-0.035em;color:#fff">From album to<br><span class="accent">inbox.</span></div><div style="display:flex;align-items:center;gap:20px"><div class="brand" style="gap:18px"><svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <path d="M47.56 47.56 A22 22 0 1 1 47.56 16.44" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="5" fill="#f3d58b"/>
</svg><span style="font-size:32px">CreditCrate</span></div></div></div></body></html>
