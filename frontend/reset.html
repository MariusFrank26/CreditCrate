<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#08090a" />
<title>Reset password · CreditCrate</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    --void: #08090a; --carbon: #0f1011; --obsidian: #161718; --graphite: #23252a; --smoke: #383b3f;
    --ash: #62666d; --fog: #8a8f98; --mist: #d0d6e0; --paper: #ffffff; --sunshine: #f3d58b; --sky: #a9d8ef;
    --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html, body { min-height: 100%; background: var(--void); color: var(--mist); font-family: var(--sans); font-size: 16px; line-height: 1.6; letter-spacing: -0.011em; }
  .page { max-width: 760px; margin: 0 auto; padding: 56px 24px 96px; }
  a { color: var(--sky); }
  .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  h1 { font-size: clamp(30px, 4vw, 40px); font-weight: 600; letter-spacing: -0.03em; color: var(--paper); line-height: 1.15; margin-top: 12px; }
  h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.016em; color: var(--paper); margin: 40px 0 10px; }
  p, li { color: var(--fog); margin: 10px 0; }
  ul { padding-left: 20px; }
  strong { color: var(--mist); font-weight: 600; }
  .draft { margin-top: 24px; padding: 14px 16px; background: var(--carbon); border: 1px solid var(--graphite); border-radius: 12px; font-size: 14px; }
  .draft strong { color: var(--sunshine); }
  .back { display: inline-block; margin-top: 40px; font-size: 14px; }
  .rule { height: 1px; background: var(--graphite); margin: 32px 0 0; }
  .form { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; max-width: 380px; }
  .form label { font-family: var(--mono); font-size: 12px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  .form input { margin-top: 6px; width: 100%; padding: 12px 14px; background: var(--carbon); color: var(--paper); border: 1px solid var(--graphite); border-radius: 10px; font: inherit; font-size: 15px; }
  .form input:focus { outline: 2px solid var(--sky); outline-offset: 1px; }
  .form button { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--sunshine); color: var(--void); font: inherit; font-weight: 600; cursor: pointer; }
  .form button:disabled { opacity: .6; cursor: default; }
  .note { margin-top: 18px; font-size: 14px; }
  .note.bad { color: #f2a79c; }
  .note.good { color: #a3ddc2; }
</style>
</head>
<body>
<main class="page">
  <p class="eyebrow">Account</p>
  <h1>Choose a new password</h1>
  <p>Pick a password of at least 8 characters. The reset link works once.</p>

  <form class="form" id="reset-form" novalidate>
    <div>
      <label for="pw">New password</label>
      <input id="pw" type="password" name="password" autocomplete="new-password" minlength="8" required />
    </div>
    <div>
      <label for="pw2">Repeat password</label>
      <input id="pw2" type="password" name="password2" autocomplete="new-password" minlength="8" required />
    </div>
    <button type="submit" id="submit">Set new password</button>
  </form>
  <p class="note" id="note" role="status" aria-live="polite"></p>

  <div class="rule"></div>
  <a class="back" href="index.html">← Back to CreditCrate</a>
</main>
<script>
  const API = "https://api.creditcrate.app/api";
  const form = document.getElementById("reset-form");
  const note = document.getElementById("note");
  const btn = document.getElementById("submit");
  const token = new URLSearchParams(window.location.search).get("token") || "";

  function say(text, good) {
    note.textContent = text;
    note.className = "note " + (good ? "good" : "bad");
  }

  if (!token) say("This page needs a reset link from your email.", false);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;
    if (!token) return say("This page needs a reset link from your email.", false);
    if (pw.length < 8) return say("Use at least 8 characters.", false);
    if (pw !== pw2) return say("The two passwords do not match.", false);
    btn.disabled = true;
    try {
      const res = await fetch(`${API}/password/reset`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        say(data.error || "Something went wrong. Try again.", false);
        btn.disabled = false;
        return;
      }
      form.remove();
      say("Your password is changed. Log in with the new one.", true);
      note.insertAdjacentHTML("afterend", '<p class="note"><a href="index.html">Go to log in</a></p>');
    } catch (err) {
      say("Could not reach the server. Check your connection and try again.", false);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
