// The home strip: a greeting and three figures. The apps themselves are the dashboard.
function OverviewTool({ token, onAuthError }) {
  const [counts, setCounts] = useState(null);
  const { error, run } = useToolRunner(onAuthError);

  useEffect(() => {
    run(async () => {
      const [contacts, packs, campaigns] = await Promise.all([
        callApi("/contacts", token),
        callApi("/packs", token),
        callApi("/campaigns", token),
      ]);
      setCounts({
        contacts: contacts.contacts.length,
        packs: packs.packs.length,
        sent: campaigns.campaigns.filter(c => c.status === "sent").length,
      });
    });
  }, []);

  const hour = new Date().getHours();
  const greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const figures = [["Contacts", counts?.contacts], ["Packs", counts?.packs], ["Campaigns sent", counts?.sent]];

  return (
    <div className="dash-strip">
      <div className="dash-hello">
        <p className="dash-date">{new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}</p>
        <h2 className="dash-greeting">{greeting}.</h2>
      </div>
      <ToolMessages error={error} />
      <dl className="dash-figures">
        {figures.map(([label, value]) => (
          <div key={label} className="dash-figure">
            <dt>{label}</dt>
            <dd>{value ?? "—"}</dd>
          </div>
        ))}
      </dl>
    </div>
  );
}

// The apps as a picture gallery: one app in front, its neighbours peeking in from the sides.
// Swipe or drag left and right, use the arrow keys, the tabs in the title bar, or the dots.
const DECK_TABS = ["Credits", "Contacts", "Packs", "Campaigns", "Deal Desk"];
const DECK_GAP = 24;

function AppDeck({ children, index, onIndexChange }) {
  const apps = Children.toArray(children).filter(isValidElement);
  const stageRef = useRef(null);
  const dragStart = useRef(null);
  const programmatic = useRef(false);
  const [dragging, setDragging] = useState(false);
  const last = apps.length - 1;

  function step() {
    const first = stageRef.current?.children[0];
    return first ? first.offsetWidth + DECK_GAP : 1;
  }

  function scrollToApp(i) {
    const stage = stageRef.current;
    if (!stage) return;
    const target = Math.max(0, Math.min(last, i));
    programmatic.current = true;
    stage.scrollTo({ left: target * step(), behavior: "smooth" });
    setTimeout(() => { programmatic.current = false; }, 600);
    onIndexChange(target);
  }

  // Follow the title-bar tabs, arrows and dots
  useEffect(() => {
    const stage = stageRef.current;
    if (!stage) return;
    if (Math.abs(stage.scrollLeft - index * step()) > 2) scrollToApp(index);
  }, [index]);

  // Follow native swipes and trackpad scrolls
  function onScroll() {
    if (programmatic.current || dragStart.current) return;
    const stage = stageRef.current;
    const i = Math.max(0, Math.min(last, Math.round(stage.scrollLeft / step())));
    if (i !== index) onIndexChange(i);
  }

  // Mouse drag. Touch uses the browser's own swipe.
  function onPointerDown(e) {
    if (e.pointerType !== "mouse" || e.target.closest("input, textarea, select")) return;
    dragStart.current = { x: e.clientX, left: stageRef.current.scrollLeft };
  }

  function onPointerMove(e) {
    if (!dragStart.current) return;
    const dx = e.clientX - dragStart.current.x;
    if (!dragging && Math.abs(dx) > 6) setDragging(true);
    if (dragging || Math.abs(dx) > 6) stageRef.current.scrollLeft = dragStart.current.left - dx;
  }

  function onPointerUp() {
    if (!dragStart.current) return;
    const wasDragging = dragging;
    dragStart.current = null;
    setDragging(false);
    if (wasDragging) scrollToApp(Math.round(stageRef.current.scrollLeft / step()));
  }

  function onKeyDown(e) {
    if (e.key === "ArrowRight") scrollToApp(index + 1);
    if (e.key === "ArrowLeft") scrollToApp(index - 1);
  }

  return (
    <section className="deck" aria-label="Apps">
      <div
        ref={stageRef}
        className={`deck-stage${dragging ? " dragging" : ""}`}
        tabIndex={0}
        role="region"
        aria-roledescription="carousel"
        aria-label="Apps. Use the left and right arrow keys to switch."
        onScroll={onScroll}
        onKeyDown={onKeyDown}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerLeave={onPointerUp}
      >
        {apps.map((app, i) => (
          <div
            key={app.props.name}
            className={`deck-card${i === index ? " is-active" : ""}`}
            aria-hidden={i !== index}
            onClick={() => i !== index && scrollToApp(i)}
          >
            {app}
          </div>
        ))}
      </div>

      <div className="deck-controls">
        <button type="button" className="deck-arrow" onClick={() => scrollToApp(index - 1)} disabled={index === 0} aria-label="Previous app">←</button>
        <div className="deck-dots">
          {apps.map((app, i) => (
            <button
              key={app.props.name}
              type="button"
              className="deck-dot"
              aria-label={`Show ${app.props.name}`}
              aria-current={i === index ? "true" : undefined}
              onClick={() => scrollToApp(i)}
            />
          ))}
        </div>
        <span className="deck-name">{apps[index]?.props.name}</span>
        <button type="button" className="deck-arrow" onClick={() => scrollToApp(index + 1)} disabled={index === last} aria-label="Next app">→</button>
      </div>
    </section>
  );
}

function App() {
  const initialParams = new URLSearchParams(window.location.search);
  const initialRole = initialParams.get("role");

  const [albumQuery, setAlbumQuery] = useState(initialParams.get("q") || "");
  const [artistQuery, setArtistQuery] = useState(initialParams.get("artist") || "");
  const [searchResults, setSearchResults] = useState(null);
  const [selectedAlbum, setSelectedAlbum] = useState(null);
  const [credits, setCredits] = useState(null);
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const [error, setError] = useState(null);
  const [roleFilter, setRoleFilter] = useState(ROLE_FILTERS.includes(initialRole) ? initialRole : "ALL");
  const [token, setToken] = useState(readToken);
  const [showLogin, setShowLogin] = useState(false);
  const [deckIndex, setDeckIndex] = useState(0);
  const [apiStatus, setApiStatus] = useState("checking"); // checking | online | offline

  // 1=search, 2=pick album, 3=credits
  const step = selectedAlbum ? 3 : (searchResults || loading) ? 2 : 1;

  // Searches the signed-in account has run before, and the one currently opened as an overview
  const [history, setHistory] = useState([]);
  const [openSearch, setOpenSearch] = useState(null);

  async function loadHistory() {
    if (!token) return;
    try {
      const res = await fetch(`${API}/history`, { headers: authHeaders(token) });
      if (res.ok) setHistory((await res.json()).searches);
    } catch { /* the list just stays as it was */ }
  }

  useEffect(() => { loadHistory(); }, [token]);

  function saveSearch(album, creditList) {
    fetch(`${API}/history`, {
      method: "POST",
      headers: { ...authHeaders(token), "Content-Type": "application/json" },
      body: JSON.stringify({ id: album.id, name: album.name, artist: album.artist, cover_art: album.cover_art, credits: creditList }),
    }).then(loadHistory).catch(() => {});
  }

  async function openHistory(id) {
    try {
      const res = await fetch(`${API}/history/${id}`, { headers: authHeaders(token) });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      setOpenSearch(await res.json());
    } catch (e) {
      setError(e.message);
    }
  }

  useEffect(() => {
    let cancelled = false;
    fetch(`${API}/health`)
      .then(res => { if (!cancelled) setApiStatus(res.ok ? "online" : "offline"); })
      .catch(() => { if (!cancelled) setApiStatus("offline"); });
    return () => { cancelled = true; };
  }, []);

  async function runSearch(album, artist) {
    const q = album.trim();
    if (!q) return;
    setUrlParam("q", q);
    setUrlParam("artist", artist.trim());
    setLoading(true);
    setError(null);
    setSearchResults(null);
    setCredits(null);
    setSelectedAlbum(null);
    setStatusMsg("Searching Genius…");
    try {
      const res = await fetch(`${API}/search?album=${encodeURIComponent(q)}&artist=${encodeURIComponent(artist.trim())}`, { headers: authHeaders(token) });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setSearchResults(data.results);
      if (data.results.length === 0) setStatusMsg("No albums found. Try a different query.");
      else setStatusMsg(`Found ${data.results.length} album${data.results.length !== 1 ? "s" : ""}. Pick one.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  // Re-run the search when the page was opened with ?q= in the URL
  useEffect(() => {
    if (token && albumQuery.trim()) runSearch(albumQuery, artistQuery);
  }, []);

  function handleSearch(e) {
    e.preventDefault();
    runSearch(albumQuery, artistQuery);
  }

  async function handleSelectAlbum(album) {
    setSelectedAlbum(album);
    setLoading(true);
    setError(null);
    setCredits(null);
    setStatusMsg(`Fetching track credits for "${album.name}"… this may take a minute.`);
    try {
      const res = await fetch(`${API}/album/${album.id}/credits`, { headers: authHeaders(token) });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setCredits(data.credits);
      saveSearch(album, data.credits);
      setStatusMsg(`Found ${data.credits.length} credited person${data.credits.length !== 1 ? "s" : ""}.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  function handleBack() {
    setSelectedAlbum(null);
    setCredits(null);
    setError(null);
    setStatusMsg(`Found ${searchResults.length} album${searchResults.length !== 1 ? "s" : ""}. Pick one.`);
  }

  function handleSignedIn(newToken) {
    storeToken(newToken);
    setToken(newToken);
    setShowLogin(false);
    setError(null);
  }

  function signOut(message = null) {
    storeToken("");
    setToken("");
    setShowLogin(false);
    setSearchResults(null);
    setSelectedAlbum(null);
    setCredits(null);
    setStatusMsg("");
    setError(message);
  }

  function changeRole(role) {
    setRoleFilter(role);
    setUrlParam("role", role === "ALL" ? "" : role);
  }

  const filteredCredits = credits ? credits.filter(c => {
    if (roleFilter === "ALL") return true;
    return c.roles.some(r => roleClass(r) === roleFilter.toLowerCase());
  }) : [];

  return (
    <>
    {token && (
      <div className="app-bar">
        <div className="app-bar-inner">
          <span className="app-bar-brand">
            <img src="logo.svg" alt="" width="22" height="22" />
            CreditCrate
          </span>
          <nav className="tool-nav" aria-label="Apps">
            {DECK_TABS.map((label, i) => (
              <button
                key={label}
                type="button"
                className="tool-tab"
                aria-current={deckIndex === i ? "page" : undefined}
                onClick={() => setDeckIndex(i)}
              >
                {label}
              </button>
            ))}
          </nav>
        </div>
      </div>
    )}
    <div className={token ? "page signed-in" : "page"}>
      <header>
        <h1 className="brand">
          <img className="brand-mark" src="logo.svg" alt="" width="56" height="56" />
          CreditCrate
          <span className="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        </h1>
        <div className="header-actions">
          <div className="header-status" role="status">
            <span className={`status-dot ${apiStatus}`} aria-hidden="true"></span>
            {apiStatus === "online" ? "Service online" : apiStatus === "offline" ? "Service offline" : "Checking service…"}
          </div>
          <p className="tagline">
            Producer credits<br/>
            Public contacts
          </p>
          {token && <button type="button" className="back-btn" onClick={() => signOut()}>Sign out</button>}
        </div>
      </header>

      <main id="main" className={token ? "app-main" : undefined}>
        {error && <div className="error-msg" role="alert">⚠ {error}</div>}

        {token && <OverviewTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} />}
        {token && (
        <AppDeck index={deckIndex} onIndexChange={setDeckIndex}>
        <AppWindow name="Credits"><>
        <CreditsHeader />
        <ol className="step-indicator" aria-label="Progress">
          {STEPS.map(([n, label]) => (
            <li
              key={n}
              className={`step ${step === +n ? "active" : step > +n ? "done" : ""}`}
              aria-current={step === +n ? "step" : undefined}
            >
              <span className="step-num" aria-hidden="true">{step > +n ? "✓" : n}</span>
              {label}
            </li>
          ))}
        </ol>

        <form className="search-block" role="search" onSubmit={handleSearch}>
          <div className="search-row">
            <div className="search-input-wrap">
              <label className="search-label" htmlFor="album-input">Album name</label>
              <input
                id="album-input"
                type="text"
                name="album"
                placeholder="e.g. good kid, m.A.A.d city"
                autoComplete="off"
                spellCheck={false}
                enterKeyHint="search"
                required
                value={albumQuery}
                onChange={e => setAlbumQuery(e.target.value)}
              />
            </div>
            <div className="search-input-wrap search-input-artist">
              <label className="search-label" htmlFor="artist-input">Artist (optional)</label>
              <input
                id="artist-input"
                type="text"
                name="artist"
                placeholder="e.g. Kendrick Lamar"
                autoComplete="off"
                spellCheck={false}
                enterKeyHint="search"
                value={artistQuery}
                onChange={e => setArtistQuery(e.target.value)}
              />
            </div>
            <button
              type="submit"
              className="search-btn"
              disabled={loading || !albumQuery.trim()}
              aria-busy={loading}
            >
              {loading && <span className="spinner" aria-hidden="true" />}
              Search
            </button>
          </div>
        </form>

        <div role="status" aria-live="polite">
          {(loading || statusMsg) && (
            <div className="status-bar">
              {loading && <span className="spinner" aria-hidden="true" />}
              <span>{statusMsg}</span>
            </div>
          )}
        </div>

        {searchResults && searchResults.length > 0 && !selectedAlbum && (
          <ul className="album-results">
            {searchResults.map(alb => (
              <li key={alb.id}>
                <button type="button" className="album-card" onClick={() => handleSelectAlbum(alb)}>
                  {alb.cover_art ? (
                    <img className="album-cover" src={alb.cover_art} alt="" width="220" height="220" loading="lazy" decoding="async" />
                  ) : (
                    <div className="album-cover-placeholder" aria-hidden="true">♪</div>
                  )}
                  <span className="album-info">
                    <span className="album-name">{alb.name}</span>
                    <span className="album-artist">{alb.artist}</span>
                  </span>
                </button>
              </li>
            ))}
          </ul>
        )}

        {credits && credits.length > 0 && (
          <section aria-labelledby="credits-heading">
            <div className="credits-header">
              <button type="button" className="back-btn" onClick={handleBack} disabled={loading}>← Results</button>
              <h2 id="credits-heading" className="credits-title">{selectedAlbum.name}</h2>
              <div className="filter-row" role="group" aria-label="Filter by role">
                {ROLE_FILTERS.map(f => (
                  <button
                    type="button"
                    key={f}
                    className={`filter-btn ${roleFilter === f ? "active" : ""}`}
                    aria-pressed={roleFilter === f}
                    onClick={() => changeRole(f)}
                  >
                    {filterLabel(f)}
                  </button>
                ))}
              </div>
              <button
                type="button"
                className="export-btn"
                onClick={() => csvExport(filteredCredits, selectedAlbum.name)}
                disabled={filteredCredits.length === 0}
              >
                <span aria-hidden="true">↓</span> Export CSV
              </button>
            </div>

            {filteredCredits.length === 0 ? (
              <p className="inline-empty">
                No {roleFilter.toLowerCase()} credits on this album.
                <button type="button" className="filter-btn" onClick={() => changeRole("ALL")}>Show all</button>
              </p>
            ) : (
              <div className="table-wrap">
                <table className="credits-table">
                  <caption className="sr-only">Credits for {selectedAlbum.name}</caption>
                  <thead>
                    <tr>
                      <th scope="col">Name</th>
                      <th scope="col">Roles</th>
                      <th scope="col">Tracks</th>
                      <th scope="col">Instagram</th>
                      <th scope="col">Email</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredCredits.map((c, i) => (
                      <CreditRow key={c.name} credit={c} delay={i * 30} />
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </section>
        )}

        {credits && credits.length === 0 && !loading && (
          <div className="empty-state">
            <span className="big" aria-hidden="true">∅</span>
            <p>No credits found for this album on Genius.</p>
            <button type="button" className="back-btn" onClick={handleBack}>← Back to results</button>
          </div>
        )}

        <section className="history" aria-labelledby="history-heading">
          <div className="history-head">
            <h2 id="history-heading" className="history-title">Recent searches</h2>
            <span className="history-count">{history.length} {history.length === 1 ? "album" : "albums"}</span>
          </div>

          {history.length === 0 ? (
            <p className="inline-empty">Albums you search for will show up here, with the emails found for each.</p>
          ) : (
            <ul className="history-grid">
              {history.map(s => (
                <li key={s.id}>
                  <button
                    type="button"
                    className={`history-card${openSearch?.id === s.id ? " is-open" : ""}`}
                    aria-pressed={openSearch?.id === s.id}
                    onClick={() => openHistory(s.id)}
                  >
                    {s.cover_art ? (
                      <img className="history-cover" src={s.cover_art} alt="" width="64" height="64" loading="lazy" decoding="async" />
                    ) : (
                      <span className="history-cover history-cover-empty" aria-hidden="true">♪</span>
                    )}
                    <span className="history-info">
                      <span className="history-name">{s.name}</span>
                      <span className="history-artist">{s.artist}</span>
                      <span className="history-meta">{s.emails} of {s.people} with email</span>
                    </span>
                  </button>
                </li>
              ))}
            </ul>
          )}

          {openSearch && (
            <div className="history-overview">
              <div className="credits-header">
                <h3 className="credits-title">{openSearch.name}</h3>
                <span className="history-meta">
                  {openSearch.credits.filter(c => c.instagram_data?.email).length} of {openSearch.credits.length} with email
                </span>
                <button
                  type="button"
                  className="export-btn"
                  onClick={() => csvExport(openSearch.credits, openSearch.name)}
                  disabled={openSearch.credits.length === 0}
                >
                  <span aria-hidden="true">↓</span> Export CSV
                </button>
                <button type="button" className="back-btn" onClick={() => setOpenSearch(null)}>Close</button>
              </div>
              {openSearch.credits.length === 0 ? (
                <p className="inline-empty">No credits were found for this album.</p>
              ) : (
                <div className="table-wrap">
                  <table className="credits-table">
                    <caption className="sr-only">Credits for {openSearch.name}</caption>
                    <thead>
                      <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Roles</th>
                        <th scope="col">Tracks</th>
                        <th scope="col">Instagram</th>
                        <th scope="col">Email</th>
                      </tr>
                    </thead>
                    <tbody>
                      {openSearch.credits.map((c, i) => (
                        <CreditRow key={c.name} credit={c} delay={i * 30} />
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </section>

        </></AppWindow>}

        {token && <AppWindow name="Contacts"><ContactsTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Packs"><PacksTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Campaigns"><CampaignsTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Deal Desk"><DealDeskTool /></AppWindow>}
        </AppDeck>
        )}

        {!token && <>
          <section className="hero" aria-labelledby="hero-heading">
            <p className="eyebrow">Launching soon</p>
            <h2 id="hero-heading" className="hero-title">Get your beats to the people who made the records.</h2>
            <p className="hero-copy">
              CreditCrate finds the producers, engineers and mixers behind any album, keeps your contacts and packs
              in one place, and sends campaigns you can track.
            </p>
            <NewsletterForm />
          </section>
          <Features />
          <Pipeline />
          <Explainer />
        </>}
      </main>

      <footer className="site-footer">
        {!token && showLogin && <LoginForm onSignedIn={handleSignedIn} />}
        <div className="site-footer-row">
          <span>CreditCrate © 2026</span>
          {!token && (
            <button type="button" className="back-btn" aria-expanded={showLogin} onClick={() => setShowLogin(s => !s)}>
              {showLogin ? "Close" : "Member sign in"}
            </button>
          )}
        </div>
      </footer>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
