// Runs a tool's API action with shared busy and error handling
function useToolRunner(onAuthError) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function run(action) {
    setBusy(true);
    setError(null);
    try {
      await action();
    } catch (e) {
      if (e.expired) onAuthError();
      else setError(e.message);
    } finally {
      setBusy(false);
    }
  }

  return { busy, error, run };
}

function avatarColor() {
  return "var(--graphite)";
}

function displayName(c) {
  return c.name || c.email;
}

function initialsOf(c) {
  const parts = displayName(c).replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/).slice(0, 2);
  return parts.map(p => p.charAt(0).toUpperCase()).join("") || "?";
}

function sectionLetter(c) {
  const first = displayName(c).trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(first) ? first : "#";
}

function ContactsTool({ token, onAuthError }) {
  const [contacts, setContacts] = useState(null);
  const [query, setQuery] = useState("");
  const [source, setSource] = useState("all");
  const [album, setAlbum] = useState("");
  const [selected, setSelected] = useState(null);
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ email: "", name: "", roles: "", instagram: "", tags: "" });
  const [message, setMessage] = useState(null);
  const { busy, error, run } = useToolRunner(onAuthError);
  const set = key => value => setForm(f => ({ ...f, [key]: value }));

  async function load() {
    const data = await callApi("/contacts", token);
    setContacts(data.contacts);
  }

  useEffect(() => { run(load); }, []);

  function addContact(e) {
    e.preventDefault();
    run(async () => {
      await callApi("/contacts", token, { method: "POST", body: form });
      setForm({ email: "", name: "", roles: "", instagram: "", tags: "" });
      setAdding(false);
      setMessage("Contact saved.");
      await load();
    });
  }

  function importCsv(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const data = new FormData();
    data.append("file", file);
    run(async () => {
      const result = await callApi("/contacts/import", token, { method: "POST", form: data });
      setAdding(false);
      setMessage(`Imported ${result.saved} contacts. ${result.skipped} rows had no valid email and were skipped.`);
      await load();
    });
  }

  const q = query.trim().toLowerCase();
  const sources = [...new Set((contacts || []).map(c => c.source).filter(Boolean))];
  const albums = [...new Set((contacts || []).map(c => c.album).filter(Boolean))].sort();
  const visible = (contacts || [])
    .filter(c => source === "all" || c.source === source)
    .filter(c => !album || c.album === album)
    .filter(c => !q || [c.name, c.email, c.roles, c.tags, c.instagram].some(v => (v || "").toLowerCase().includes(q)))
    .sort((a, b) => displayName(a).localeCompare(displayName(b)));
  const groups = [];
  for (const c of visible) {
    const letter = sectionLetter(c);
    const last = groups[groups.length - 1];
    if (last && last.letter === letter) last.items.push(c);
    else groups.push({ letter, items: [c] });
  }

  return (
    <section className="ios" aria-labelledby="contacts-heading">
      <div className="ios-large-title">
        <div>
          <p className="ios-count">{contacts ? `${contacts.length} ${contacts.length === 1 ? "person" : "people"}` : "Loading"}</p>
          <h2 id="contacts-heading" className="ios-title">Contacts</h2>
        </div>
        <button type="button" className="ios-add" onClick={() => setAdding(true)} aria-label="Add contact">+</button>
      </div>

      <ToolMessages error={error} message={message} />

      <label className="ios-search">
        <span aria-hidden="true">⌕</span>
        <input
          type="search"
          placeholder="Search"
          aria-label="Search contacts"
          autoComplete="off"
          value={query}
          onChange={e => setQuery(e.target.value)}
        />
      </label>

      {contacts && contacts.length > 0 && (
        <div className="ios-filters">
          <div className="ios-chips" role="group" aria-label="Filter by source">
            {[["all", "All"], ...sources.map(id => [id, SOURCE_LABELS[id] || id])].map(([id, label]) => (
              <button key={id} type="button" className="ios-chip" aria-pressed={source === id} onClick={() => setSource(id)}>
                {label}
              </button>
            ))}
          </div>
          {albums.length > 0 && (
            <select className="ios-album-select" aria-label="Filter by album" value={album} onChange={e => setAlbum(e.target.value)}>
              <option value="">All albums</option>
              {albums.map(name => <option key={name} value={name}>{name}</option>)}
            </select>
          )}
        </div>
      )}

      {contacts === null ? (
        <ToolLoading label="Loading contacts…" />
      ) : contacts.length === 0 ? (
        <EmptyState title="No contacts yet" copy="Tap + to add someone, or import a CSV." />
      ) : visible.length === 0 ? (
        <p className="ios-none">{query ? `No matches for “${query}”.` : "No contacts match this filter."}</p>
      ) : (
        groups.map(group => (
          <div key={group.letter} className="ios-section">
            <h3 className="ios-letter">{group.letter}</h3>
            <ul className="ios-group">
              {group.items.map(c => (
                <li key={c.email}>
                  <button type="button" className="ios-row" onClick={() => setSelected(c)}>
                    <span className="ios-avatar" style={{ background: avatarColor(c.email) }} aria-hidden="true">{initialsOf(c)}</span>
                    <span className="ios-row-text">
                      <span className="ios-name">{displayName(c)}</span>
                      <span className="ios-sub">{c.roles || c.email}</span>
                    </span>
                    <span className="ios-chevron" aria-hidden="true">›</span>
                  </button>
                </li>

  try {
    return new URL(url).hostname.replace(/^www\./, "");

function packDate(timestamp) {

function timeAgo(timestamp) {
  const seconds = Math.max(0, Date.now() / 1000 - timestamp);
  if (seconds < 3600) return `${Math.max(1, Math.round(seconds / 60))}m ago`;
  if (seconds < 86400) return `${Math.round(seconds / 3600)}h ago`;
  return `${Math.round(seconds / 86400)}d ago`;
}

function statusText(status) {
  if (!status) return "";
  if (status === "sending") return "Sending now";
  if (status === "partial") return "Partly sent. The daily limit or a stop left people waiting.";
  if (status.startsWith("stopped")) return `Stopped. ${status.replace(/^stopped:\s*/, "")}`;
  return status.charAt(0).toUpperCase() + status.slice(1);
}

const INBOX_EXAMPLES = [

function formatSize(bytes) {
  if (!bytes) return "";
  if (bytes >= 1000000) return `${Math.round(bytes / 1000000)} MB`;
  return `${Math.max(1, Math.round(bytes / 1000))} KB`;
}

// The sample inbox. Files are read from Gmail on demand and passed straight to the browser.
// Chat-style inbox helpers: one conversation per sender, like Messages on iPhone
const CHAT_TONES = [
  ["#c9b6ee", "#1d1a24"], ["#a9d8ef", "#15222a"], ["#a3ddc2", "#122119"],
  ["#f2a79c", "#2a1714"], ["#f3d58b", "#2a2212"], ["#9fb4f2", "#141a2c"],
];

function avatarTone(name) {
  let hash = 0;
  for (const ch of name || "") hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const [bg, ink] = CHAT_TONES[hash % CHAT_TONES.length];
  return { background: bg, color: ink };
}

// The same pack can arrive with different per-email parameters, so compare only the folder or file
function packId(link) {
  try {
    const url = new URL(link);
    const rlkey = url.searchParams.get("rlkey");
    return `${url.hostname}${url.pathname}${rlkey ? `?rlkey=${rlkey}` : ""}`;
  } catch (e) {
    return link;
  }
}

// Each pack is shown once per chat, under the first message that carries it
function firstPackOwners(chat) {
  const owners = new Map();
  chat.items.forEach(item => item.links.forEach(link => {
    const id = packId(link);
    if (!owners.has(id)) owners.set(id, item.uid);
  }));
  return owners;
}

// Dropbox or Google Drive, for the name on a pack card
function packSourceName(link) {
  return /drive\.google\.com|docs\.google\.com/.test(link) ? "Google Drive" : "Dropbox";
}

function parseSender(from) {
  const match = (from || "").match(/^(.*?)<([^>]+)>\s*$/);
  if (match) {
    return { name: match[1].replace(/^"|"$/g, "").trim() || match[2], address: match[2].trim().toLowerCase() };
  }
  return { name: (from || "").trim() || "Unknown sender", address: (from || "").trim().toLowerCase() };
}

function senderInitials(name) {
  const parts = (name || "").replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/).slice(0, 2);
  return parts.map(p => p.charAt(0).toUpperCase()).join("") || "?";
}

function messageTime(dateStr) {
  const d = new Date(dateStr);
  if (!dateStr || isNaN(d)) return "";
  return d.toDateString() === new Date().toDateString()
    ? d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

function dayLabel(dateStr) {
  const d = new Date(dateStr);
  if (!dateStr || isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}

// Messages arrive newest first. Each sender becomes one chat, with its messages oldest first.
function groupBySender(messages) {
  const map = new Map();
  for (const m of messages) {
    const { name, address } = parseSender(m.from);
    if (!map.has(address)) map.set(address, { key: address, name, address, items: [] });
    map.get(address).items.push(m);
  }
  return [...map.values()].map(c => ({ ...c, items: [...c.items].reverse() }));
}

// The example chats shown while the inbox is empty
function exampleChats() {
  return groupBySender(INBOX_EXAMPLES.map((e, i) => ({
    uid: `example-${i}`,
    from: e.from,
    subject: e.subject,
    date: "",
    attachments: [{ part: `example-${i}`, name: e.file, size: e.size }],
    links: [],
  })));
}

function InboxTool({ token, onAuthError }) {
  const [messages, setMessages] = useState(null);
  const [chatKey, setChatKey] = useState(null);
  const [packMenuOpen, setPackMenuOpen] = useState(false);
  const scrollRef = useRef(null);
  const [message, setMessage] = useState(null);
  const [downloadError, setDownloadError] = useState(null);
  const [busyFile, setBusyFile] = useState(null);
  const [accountAddress, setAccountAddress] = useState("");
  const [downloaded, setDownloaded] = useState(new Set());
  const [batch, setBatch] = useState(null);
  const stopRef = useRef(false);
  const { busy, error, run } = useToolRunner(onAuthError);

  // The scan runs on the server in the background, so a week of mail can take as long as it needs
  async function load() {
    setMessages(null);
    const started = await callApi("/inbox/start", token, { method: "POST" });
    for (let attempt = 0; attempt < 300; attempt++) {
      await new Promise(r => setTimeout(r, 2000));
      const state = await callApi(`/jobs/${started.job}`, token);
      if (state.status === "error") throw new Error(state.error);
      if (state.status === "done") return setMessages(state.result);
    }
    throw new Error("The scan is taking too long. Try again in a few minutes.");
  }

  async function downloadZip(item) {
    setBusyFile(`zip-${item.uid}`);
    setDownloadError(null);
    setMessage(null);
    try {
      const res = await fetch(`${API}/inbox/${item.uid}/zip`, { headers: authHeaders(token) });
      if (res.status === 401) return onAuthError();
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Server error ${res.status}`);
      }
      const url = URL.createObjectURL(await res.blob());
      const link = document.createElement("a");
      link.href = url;
      link.download = `${item.subject}.zip`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      markDownloaded(item.uid, item.attachments);
      setMessage(`Downloaded ${item.subject}.zip.`);
    } catch (e) {
      setDownloadError(e.message);
    } finally {
      setBusyFile(null);
    }
  }

  useEffect(() => { run(load); }, []);

  // Which attachments were already saved on this device, per Gmail account
  const downloadKey = accountAddress ? `creditcrate-inbox-downloads:${accountAddress}` : null;

  useEffect(() => {
    callApi("/mail/account", token)
      .then(a => setAccountAddress((a && a.address) || ""))
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (!downloadKey) return;
    try {
      setDownloaded(new Set(JSON.parse(localStorage.getItem(downloadKey) || "[]")));
    } catch (e) {
      setDownloaded(new Set());
    }
  }, [downloadKey]);

  function fileKey(uid, file) {
    return `${uid}|${file.part}|${file.name}`;
  }

  function markDownloaded(uid, files) {
    setDownloaded(prev => {
      const next = new Set(prev);
      files.forEach(file => next.add(fileKey(uid, file)));
      if (downloadKey) {
        try { localStorage.setItem(downloadKey, JSON.stringify([...next])); } catch (e) { /* storage full or blocked */ }
      }
      return next;
    });
  }

  // Fetches one attachment from Gmail and saves it. Throws if it fails.
  async function saveAttachment(uid, file) {
    const res = await fetch(`${API}/inbox/${uid}/attachments/${file.part}`, { headers: authHeaders(token) });
    if (res.status === 401) {
      onAuthError();
      throw new Error("You were signed out.");
    }
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `Server error ${res.status}`);
    }
    const url = URL.createObjectURL(await res.blob());
    const link = document.createElement("a");
    link.href = url;
    link.download = file.name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    markDownloaded(uid, [file]);
  }

  async function download(uid, file) {
    setBusyFile(file.part);
    setDownloadError(null);
    setMessage(null);
    try {
      await saveAttachment(uid, file);
      setMessage(`Downloaded ${file.name}.`);
    } catch (e) {
      setDownloadError(e.message);
    } finally {
      setBusyFile(null);
    }
  }

  // Saves every sample from the last 7 days that isn't downloaded yet, one after another
  async function downloadNew() {
    const todo = [];
    for (const item of messages || []) {
      for (const file of item.attachments) {
        if (!downloaded.has(fileKey(item.uid, file))) todo.push({ uid: item.uid, file });
      }
    }
    if (todo.length === 0) {
      setMessage("Everything from the last 7 days is already downloaded.");
      return;
    }
    stopRef.current = false;
    setDownloadError(null);
    setMessage(null);
    setBatch({ done: 0, total: todo.length, current: "" });
    let failure = null;
    let stopped = false;
    for (const { uid, file } of todo) {
      if (stopRef.current) { stopped = true; break; }
      setBatch(b => ({ ...b, current: file.name }));
      try {
        await saveAttachment(uid, file);
      } catch (e) {
        failure = e.message;
        break;
      }
      setBatch(b => ({ ...b, done: b.done + 1 }));
      await new Promise(r => setTimeout(r, 900));
    }
    setBatch(null);
    if (failure) {
      setDownloadError(`Stopped: ${failure}`);
    } else if (stopped) {
      setMessage("Stopped. The samples you already have stay marked as downloaded.");
    } else {
      setMessage(`Downloaded ${todo.length} new ${todo.length === 1 ? "sample" : "samples"}.`);
    }
  }

  function stopBatch() {
    stopRef.current = true;
  }

  // New samples per sender: attachments from the last 7 days that haven't been downloaded yet
  function newSamplesIn(chat) {
    return chat.items.reduce(
      (total, item) => total + item.attachments.filter(file => !downloaded.has(fileKey(item.uid, file))).length,
      0
    );
  }

  // Packs (Dropbox or Drive links) that haven't been opened yet, per sender
  function packKey(link) {
    return `pack|${packId(link)}`;
  }

  // Unique packs in a chat that haven't been opened yet
  function newPacksIn(chat) {
    const ids = new Set();
    chat.items.forEach(item => item.links.forEach(link => ids.add(packId(link))));
    return [...ids].filter(id => !downloaded.has(`pack|${id}`)).length;
  }

  function openPack(link) {
    setDownloaded(prev => {
      const next = new Set(prev);
      next.add(packKey(link));
      if (downloadKey) {
        try { localStorage.setItem(downloadKey, JSON.stringify([...next])); } catch (e) { /* storage blocked */ }
      }
      return next;
    });
  }

  const favouritesKey = accountAddress ? `creditcrate-inbox-favourites:${accountAddress}` : null;
  const [favourites, setFavourites] = useState(new Set());

  useEffect(() => {
    if (!favouritesKey) return;
    try {
      setFavourites(new Set(JSON.parse(localStorage.getItem(favouritesKey) || "[]")));
    } catch (e) {
      setFavourites(new Set());
    }
  }, [favouritesKey]);

  function toggleFavourite(key) {
    setFavourites(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      if (favouritesKey) {
        try { localStorage.setItem(favouritesKey, JSON.stringify([...next])); } catch (e) { /* storage blocked */ }
      }
      return next;
    });
  }

  const unopenedPacks = (() => {
    const seen = new Map();
    (messages || []).forEach(item => {
      const { name } = parseSender(item.from);
      item.links.forEach(link => {
        const id = packId(link);
        if (!seen.has(id) && !downloaded.has(packKey(link))) {
          seen.set(id, { id, link, name, subject: item.subject });
        }
      });
    });
    return [...seen.values()];
  })();

  const newCount = (messages || []).reduce(
    (total, item) => total + item.attachments.filter(file => !downloaded.has(fileKey(item.uid, file))).length,
    0
  );

  const demo = messages !== null && messages.length === 0;
  const chats = demo ? exampleChats() : groupBySender(messages || []);
  const active = chats.find(c => c.key === chatKey) || chats[0] || null;
  const packOwner = active ? firstPackOwners(active) : new Map();

  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [active?.key, messages]);

  return (
    <section className="tool-section" aria-labelledby="inbox-heading">
      <div className="tool-heading">
        <p className="tool-eyebrow">Samples</p>
        <h2 id="inbox-heading" className="tool-title">Sample inbox</h2>
        <p className="tool-copy">
          Samples and shared links from your Gmail, in one place. Downloads come straight from Gmail, and nothing is stored on CreditCrate.
        </p>
      </div>
      <ToolMessages error={error || downloadError} message={message} />

      <div className="inbox-head">
        <span className="history-meta">{messages ? `${messages.length} ${messages.length === 1 ? "email" : "emails"} with samples from the last 7 days` : ""}</span>
        <div className="inbox-actions">
          {!demo && (
            <div className="inbox-menu">
              <button type="button" className="back-btn" onClick={() => setPackMenuOpen(o => !o)} aria-expanded={packMenuOpen}>
                Unopened packs ({unopenedPacks.length}) ▾
              </button>
            </div>
          )}
          {batch ? (
            <>
              <span className="history-meta">Downloading {batch.done + 1} of {batch.total}</span>
              <button type="button" className="back-btn" onClick={stopBatch}>Stop</button>
            </>
          ) : (
            <button
              type="button"
              className="imsg-action inbox-download-all"
              onClick={downloadNew}
              disabled={busy || !messages || messages.length === 0}
            >
              {newCount > 0 ? `Download ${newCount} new` : "All downloaded"}
            </button>
          )}
          <button type="button" className="back-btn" onClick={() => run(load)} disabled={busy || !!batch}>Refresh</button>
        </div>
      </div>
      {packMenuOpen && !demo && (
        <div className="inbox-dropdown" role="menu">
          {unopenedPacks.length === 0 ? (
            <p className="history-meta">All packs are opened.</p>
          ) : unopenedPacks.map(pack => (
            <a
              key={pack.id}
              className="inbox-dropdown-item"
              href={pack.link}
              target="_blank"
              rel="noopener noreferrer"
              role="menuitem"
              onClick={() => { openPack(pack.link); setPackMenuOpen(false); }}
            >
              <span className="inbox-dropdown-name">{packSourceName(pack.link)} · {pack.name}</span>
              <span className="history-meta">{pack.subject}</span>
            </a>
          ))}
        </div>
      )}

      {messages === null ? (
        <ToolLoading label="Scanning the last 7 days of email… this can take a minute." />
      ) : (
        <>
          {demo && <EmptyState title="No samples yet" copy="Emails with audio or archive attachments, and Dropbox or Drive links, show up here." />}
          <div className={`imsg${active && chatKey ? " has-chat" : ""}${demo ? " is-example" : ""}`}>
            <aside className="imsg-list" aria-label="Conversations">
              {!demo && chats.some(c => favourites.has(c.key)) && (
                <div className="imsg-pinned" aria-label="Favourites">
                  {chats.filter(c => favourites.has(c.key)).map(c => (
                    <button key={c.key} type="button" className="imsg-pin-item" onClick={() => setChatKey(c.key)} title={c.name}>
                      <span className="imsg-pin-avatar">
                        <span className="imsg-avatar imsg-avatar-pin" style={avatarTone(c.name)}>{senderInitials(c.name)}</span>
                        {newSamplesIn(c) > 0 && <span className="imsg-badge imsg-badge-pin">{newSamplesIn(c)}</span>}
                        {newPacksIn(c) > 0 && <span className="imsg-badge imsg-badge-pin imsg-badge-pack imsg-badge-pin-pack">{newPacksIn(c)}</span>}
                      </span>
                      <span className="imsg-pin-name">{c.name}</span>
                    </button>
                  ))}
                </div>
              )}
              {chats.map(c => {
                const last = c.items[c.items.length - 1];
                return (
                  <button key={c.key} type="button" className={`imsg-conv${active && c.key === active.key ? " is-active" : ""}`} onClick={() => setChatKey(c.key)}>
                    <span className="imsg-avatar" style={avatarTone(c.name)}>{senderInitials(c.name)}</span>
                    <span className="imsg-conv-text">
                      <span className="imsg-conv-name">{c.name}</span>
                      <span className="imsg-conv-last">{last.subject}</span>
                    </span>
                    <span className="imsg-conv-side">
                      <span className="imsg-conv-time">{messageTime(last.date)}</span>
                      {!demo && (newSamplesIn(c) > 0 || newPacksIn(c) > 0) && (
                        <span className="imsg-badges">
                          {newSamplesIn(c) > 0 && <span className="imsg-badge">{newSamplesIn(c)}</span>}
                          {newPacksIn(c) > 0 && <span className="imsg-badge imsg-badge-pack">{newPacksIn(c)}</span>}
                        </span>
                      )}
                    </span>
                  </button>
                );
              })}
            </aside>

            <div className="imsg-thread">
              {active && (
                <>
                  <header className="imsg-thread-head">
                    <button type="button" className="imsg-back" onClick={() => setChatKey(null)}>‹ Chats</button>
                    <span className="imsg-avatar imsg-avatar-lg" style={avatarTone(active.name)}>{senderInitials(active.name)}</span>
                    <span className="imsg-thread-name">{active.name}</span>
                    {!demo && <span className="imsg-thread-addr">{active.address}</span>}
                    {!demo && (
                      <button
                        type="button"
                        className={`imsg-fav${favourites.has(active.key) ? " is-on" : ""}`}
                        onClick={() => toggleFavourite(active.key)}
                        aria-pressed={favourites.has(active.key)}
                      >
                        {favourites.has(active.key) ? "★ Favourite" : "☆ Add to favourites"}
                      </button>
                    )}
                  </header>
                  <div className="imsg-scroll" ref={scrollRef}>
                    {active.items.map(item => (
                      <div key={item.uid} className="imsg-message">
                        {dayLabel(item.date) && <div className="imsg-day">{dayLabel(item.date)}</div>}
                        <div className="imsg-row">
                          <span className="imsg-avatar imsg-avatar-sm" style={avatarTone(active.name)}>{senderInitials(active.name)}</span>
                          <div className="imsg-bubbles">
                            <div className="imsg-bubble">{item.subject}</div>
                            {item.attachments.map(file => (
                              <div key={file.part} className="imsg-bubble imsg-file">
                                <span className="imsg-file-name">{file.name}</span>
                                <span className="imsg-file-meta">
                                  {formatSize(file.size)}{!demo && downloaded.has(fileKey(item.uid, file)) ? " · Downloaded" : ""}
                                </span>
                                <button
                                  type="button"
                                  className="imsg-action"
                                  onClick={() => download(item.uid, file)}
                                  disabled={demo || busyFile === file.part || !!batch}
                                >
                                  {busyFile === file.part ? "Downloading…" : "Download"}
                                </button>
                              </div>
                            ))}
                            {item.attachments.length > 1 && (
                              <button
                                type="button"
                                className="imsg-action imsg-action-zip"
                                onClick={() => downloadZip(item)}
                                disabled={demo || busyFile === `zip-${item.uid}`}
                              >
                                {busyFile === `zip-${item.uid}` ? "Preparing zip…" : `Download all ${item.attachments.length} as a zip`}
                              </button>
                            )}
                            {item.links.filter(link => packOwner.get(packId(link)) === item.uid).map(link => (
                              <div key={link} className="imsg-bubble imsg-file imsg-pack">
                                <span className="imsg-file-name">{packSourceName(link)} pack</span>
                                <span className="imsg-file-meta">{item.subject}</span>
                                <a className="imsg-action" href={link} target="_blank" rel="noopener noreferrer" onClick={() => openPack(link)}>Open pack ↗</a>
                              </div>
                            ))}
                          </div>
                          <time className="imsg-time">{messageTime(item.date)}</time>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          </div>
        </>
      )}
    </section>
  );
}

// Personal details that can be put into a campaign's subject or message.
const CAMPAIGN_VARIABLES = [
  { token: "{{name}}", label: "Name", help: "Full name, or 'there' if we don't have one" },
  { token: "{{email}}", label: "Email", help: "Their email address" },
  { token: "{{pack_link}}", label: "Pack link", help: "The pack you pick below. Put it where you want the link" },
];

function CampaignsTool({ token, onAuthError }) {
  const [campaigns, setCampaigns] = useState(null);
  const [packs, setPacks] = useState([]);
  const [account, setAccount] = useState(null);
  const [activity, setActivity] = useState(null);
  const [form, setForm] = useState({ name: "", subject: "", body: "Hi {{name}},\n\n", pack_id: "", track: true });
  const [selectedId, setSelectedId] = useState("");
  const [audience, setAudience] = useState({ role: "", tag: "" });
  const [preview, setPreview] = useState(null);
  const [stats, setStats] = useState(null);
  const [message, setMessage] = useState(null);
  const [focusedField, setFocusedField] = useState("body");
  const { busy, error, run } = useToolRunner(onAuthError);

  // Puts a variable where the cursor is in the subject or message
  function insertVariable(variable) {
    const key = focusedField;
    const el = document.getElementById(key === "subject" ? "campaign-subject" : "campaign-body");
    const value = form[key];
    const start = el ? el.selectionStart : value.length;
    const end = el ? el.selectionEnd : value.length;
    setForm(f => ({ ...f, [key]: value.slice(0, start) + variable + value.slice(end) }));
    requestAnimationFrame(() => {
      if (!el) return;
      el.focus();
      el.setSelectionRange(start + variable.length, start + variable.length);
    });
  }

  async function load() {
    const [c, p, a, act] = await Promise.all([
      callApi("/campaigns", token),
      callApi("/packs", token),
      callApi("/mail/account", token),
      callApi("/activity", token),
    ]);
    setCampaigns(c.campaigns);
    setPacks(p.packs);
    setAccount(a);
    setActivity(act);
  }

  async function loadStats(id) {
    setStats(await callApi(`/campaigns/${id}/stats`, token));
  }

  useEffect(() => { run(load); }, []);

  useEffect(() => {
    if (selectedId) run(() => loadStats(selectedId));
    else setStats(null);
  }, [selectedId]);

  // While a campaign is sending, keep the progress up to date
  useEffect(() => {
    if (stats?.status !== "sending" || !selectedId) return undefined;
    const id = setInterval(() => {
      loadStats(selectedId).catch(() => {});
    }, 4000);
    return () => clearInterval(id);
  }, [stats?.status, selectedId]);

  function createCampaign(e) {
    e.preventDefault();
    run(async () => {
      const data = await callApi("/campaigns", token, {
        method: "POST",
        body: { ...form, pack_id: form.pack_id ? Number(form.pack_id) : null },
      });
      setSelectedId(String(data.id));
      setForm({ name: "", subject: "", body: "Hi {{name}},\n\n", pack_id: "", track: true });
      setPreview(null);
      setMessage("Draft saved. Preview who it reaches before you send.");
      await load();
    });
  }

  function requestSend(confirm) {
    return callApi(`/campaigns/${selectedId}/send`, token, {
      method: "POST",
      body: { role: audience.role.trim(), tag: audience.tag.trim(), confirm },
    });
  }

  function previewSend() {
    run(async () => {
      setMessage(null);
      setPreview(await requestSend(false));
    });
  }

  function sendNow() {
    if (!preview || !window.confirm(`Send this campaign to ${preview.would_send} people from ${account.address}? This cannot be undone.`)) return;
    run(async () => {
      const result = await requestSend(true);
      setPreview(null);
      setMessage(
        `Sending ${result.queued} emails from ${account.address}.` +
        (result.waiting ? ` ${result.waiting} more wait until the daily limit resets.` : "") +
        " Progress updates here."
      );
      await load();
      await loadStats(selectedId);
    });
  }

  function sendTest() {
    run(async () => {
      const result = await callApi("/mail/test", token, { method: "POST", body: { campaign_id: Number(selectedId) } });
      setMessage(`Test sent to ${result.sent_to}. Check your inbox.`);
    });
  }

  const selected = campaigns?.find(c => String(c.id) === selectedId);
  const canSend = Boolean(account?.connected);

  const pastCampaigns = (campaigns || []).filter(c => c.status && c.status !== "draft");
  const pastExamples = [
    { id: "ex1", name: "September 2026 Samples", sent: 42, opened: 31, clicked: 12, sent_at: null, status: "sent" },
    { id: "ex2", name: "October 2026 Samples", sent: 38, opened: 19, clicked: 4, sent_at: null, status: "sent" },
    { id: "ex3", name: "November 2026 Samples", sent: 27, opened: 14, clicked: 6, sent_at: null, status: "sent" },
  ].slice(0, Math.max(0, 3 - pastCampaigns.length));

  function pct(part, whole) {
    return whole ? Math.round((100 * part) / whole) : 0;
  }


  return (
    <section className="tool-section" aria-labelledby="campaigns-heading">
      <div className="tool-heading">
        <p className="tool-eyebrow">Outreach</p>
        <h2 id="campaigns-heading" className="tool-title">Campaigns</h2>
        <p className="tool-copy">
          Write an email, choose who receives it, and preview before anything is sent. Every email has an unsubscribe link.
        </p>
      </div>
      <ToolMessages error={error} message={message} />

      <GmailConnect token={token} onAuthError={onAuthError} account={account} onChange={setAccount} />

      <ActivityPanel activity={activity} />

      <div className="tool-grid">
        <form className="tool-card" onSubmit={createCampaign}>
          <h3 className="tool-card-title">New campaign</h3>
          <Field label="Name (internal)" id="campaign-name" value={form.name} onChange={v => setForm(f => ({ ...f, name: v }))} />
          <Field label="Subject" id="campaign-subject" value={form.subject} onChange={v => setForm(f => ({ ...f, subject: v }))} onFocus={() => setFocusedField("subject")} required />
          <Field label="Message" id="campaign-body" as="textarea" rows={8} value={form.body} onChange={v => setForm(f => ({ ...f, body: v }))} onFocus={() => setFocusedField("body")} required />
          <div className="var-bar" role="group" aria-label="Insert a personal detail">
            <span className="var-label">Insert into {focusedField === "subject" ? "subject" : "message"}</span>
            {CAMPAIGN_VARIABLES.map(v => (
              <button key={v.token} type="button" className="var-chip" title={v.help} onClick={() => insertVariable(v.token)}>{v.label}</button>
            ))}
          </div>
          <p className="var-help">
            Each person's details replace the variables when the email is sent. Name falls back to "there" if we don't have it.
          </p>
          <PackPicker packs={packs} value={form.pack_id} onChange={v => setForm(f => ({ ...f, pack_id: v }))} />
          <label className="check-row">
            <input type="checkbox" checked={form.track} onChange={e => setForm(f => ({ ...f, track: e.target.checked }))} />
            <span>Track opens and clicks</span>
          </label>
          <button type="submit" className="search-btn" disabled={busy || !form.subject.trim() || !form.body.trim()}>Save draft</button>
        </form>

        <div className="tool-card">
          <h3 className="tool-card-title">Send</h3>
          <Field label="Campaign" id="campaign-select" as="select" value={selectedId} onChange={v => { setSelectedId(v); setPreview(null); }}>
            <option value="">Choose a campaign</option>
            {(campaigns || []).map(c => (
              <option key={c.id} value={c.id}>{c.name || c.subject} ({c.status})</option>
            ))}
          </Field>
          <div className="search-row">
            <Field label="Role" id="audience-role" value={audience.role} onChange={v => { setAudience(a => ({ ...a, role: v })); setPreview(null); }} />
            <Field label="Tag" id="audience-tag" value={audience.tag} onChange={v => { setAudience(a => ({ ...a, tag: v })); setPreview(null); }} />
          </div>
          <div className="send-actions">
            <button type="button" className="back-btn" onClick={previewSend} disabled={busy || !selectedId}>Preview recipients</button>
            <button type="button" className="back-btn" onClick={sendTest} disabled={busy || !selectedId || !canSend}>Send test to me</button>
          </div>

          {preview && (
            <div className="tool-preview" role="status">
              <p>
                This would reach <strong>{preview.would_send}</strong> people.
                {!canSend && " Connect your Gmail above to send."}
              </p>
              {preview.sample?.length > 0 && <p className="panel-copy">Sample: {preview.sample.join(", ")}</p>}
              <button
                type="button"
                className="search-btn"
                onClick={sendNow}
                disabled={busy || !canSend || preview.would_send === 0}
              >
                Send to {preview.would_send} people
              </button>
            </div>
          )}

          {stats && (
            <div className="campaign-stats">
              {selected && <p className="panel-copy">Status: {statusText(stats.status)}</p>}
              {stats.tracking ? (
                <>
                  <div className="stat-grid stat-grid-compact">

            <table className="data-table">
              <caption className="sr-only">Past campaigns and their results</caption>
              <thead>

                  <th scope="col">Campaign</th>
                  <th scope="col">Status</th>

                      <span className="past-date">{c.sent_at ? new Date(c.sent_at * 1000).toLocaleDateString() : "Not sent"}</span>

                    <td>{statusText(c.status)}</td>

                    <td>
                      {c.track ? <RateBar value={pct(c.clicked, c.sent)} count={c.clicked ?? 0} color="var(--mint)" /> : <span className="past-off">Tracking off</span>}
                    </td>

                {pastExamples.map(c => (
                  <tr key={c.id} className="is-example" aria-hidden="true">
                    <td>
                      <span className="past-name">{c.name}</span>
                      <span className="past-date">Example</span>

                    <td>Sent</td>
                    <td>{c.sent}</td>
                    <td><RateBar value={pct(c.opened, c.sent)} count={c.opened} color="var(--lilac)" /></td>
                    <td><RateBar value={pct(c.clicked, c.sent)} count={c.clicked} color="var(--mint)" /></td>
                  </tr>

              </tbody>
            </table>
          </div>
        )}
        <p className="panel-copy">Click a campaign to load it into the Send card. Opens are estimates.</p>
      </section>
    </section>
  );

// The apps as a picture gallery: one app in front, its neighbours peeking in from the sides.
// Swipe or drag left and right, use the arrow keys, the tabs in the title bar, or the dots.
const DECK_TABS = ["Credits", "Contacts", "Packs", "Inbox", "Campaigns", "Deal Desk"];
const DECK_GAP = 24;

function AppDeck({ children, index, onIndexChange }) {
  const apps = Children.toArray(children).filter(isValidElement);
  const stageRef = useRef(null);
  const dragStart = useRef(null);
  const programmatic = useRef(false);
  const [dragging, setDragging] = useState(false);
  const last = apps.length - 1;

  function step() {
    const first = stageRef.current?.children[0];
    return first ? first.offsetWidth + DECK_GAP : 1;
  }

  function scrollToApp(i) {
    const stage = stageRef.current;
    if (!stage) return;
    const target = Math.max(0, Math.min(last, i));
    programmatic.current = true;
    stage.scrollTo({ left: target * step(), behavior: "smooth" });
    setTimeout(() => { programmatic.current = false; }, 600);
    onIndexChange(target);
  }

  // Follow the title-bar tabs, arrows and dots
  useEffect(() => {
    const stage = stageRef.current;
    if (!stage) return;
    if (Math.abs(stage.scrollLeft - index * step()) > 2) scrollToApp(index);
  }, [index]);

  // Follow native swipes and trackpad scrolls
  function onScroll() {
    if (programmatic.current || dragStart.current) return;
    const stage = stageRef.current;
    const i = Math.max(0, Math.min(last, Math.round(stage.scrollLeft / step())));
    if (i !== index) onIndexChange(i);
  }

  // Mouse drag. Touch uses the browser's own swipe.
  function onPointerDown(e) {
    if (e.pointerType !== "mouse" || e.target.closest("input, textarea, select")) return;
    dragStart.current = { x: e.clientX, left: stageRef.current.scrollLeft };
  }

  function onPointerMove(e) {
    if (!dragStart.current) return;
    const dx = e.clientX - dragStart.current.x;
    if (!dragging && Math.abs(dx) > 6) setDragging(true);
    if (dragging || Math.abs(dx) > 6) stageRef.current.scrollLeft = dragStart.current.left - dx;
  }

  function onPointerUp() {
    if (!dragStart.current) return;
    const wasDragging = dragging;
    dragStart.current = null;
    setDragging(false);
    if (wasDragging) scrollToApp(Math.round(stageRef.current.scrollLeft / step()));
  }

  function onKeyDown(e) {
    if (e.key === "ArrowRight") scrollToApp(index + 1);
    if (e.key === "ArrowLeft") scrollToApp(index - 1);
  }

  return (
    <section className="deck" aria-label="Apps">
      <div
        ref={stageRef}
        className={`deck-stage${dragging ? " dragging" : ""}`}
        tabIndex={0}
        role="region"
        aria-roledescription="carousel"
        aria-label="Apps. Use the left and right arrow keys to switch."
        onScroll={onScroll}
        onKeyDown={onKeyDown}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerLeave={onPointerUp}
      >
        {apps.map((app, i) => (
          <div
            key={app.props.name}
            className={`deck-card${i === index ? " is-active" : ""}`}
            aria-hidden={i !== index}
            onClick={() => i !== index && scrollToApp(i)}
          >
            {app}
          </div>
        ))}
      </div>

      <div className="deck-controls">
        <button type="button" className="deck-arrow" onClick={() => scrollToApp(index - 1)} disabled={index === 0} aria-label="Previous app">←</button>
        <div className="deck-dots">
          {apps.map((app, i) => (
            <button
              key={app.props.name}
              type="button"
              className="deck-dot"
              aria-label={`Show ${app.props.name}`}
              aria-current={i === index ? "true" : undefined}
              onClick={() => scrollToApp(i)}
            />
          ))}
        </div>
        <span className="deck-name">{apps[index]?.props.name}</span>
        <button type="button" className="deck-arrow" onClick={() => scrollToApp(index + 1)} disabled={index === last} aria-label="Next app">→</button>
      </div>
    </section>
  );
}

function App() {
  // Saves the public emails found for an album to the user's contacts, labelled with the album
  async function saveToContacts(albumName, creditList) {
    const contacts = creditList
      .filter(c => c.instagram_data?.email)
      .map(c => ({
        email: c.instagram_data.email,
        name: c.name,
        instagram: c.instagram_handle || "",
        roles: (c.roles || []).join(", "),
      }));
    if (contacts.length === 0) {
      setStatusMsg("No public emails to save for this album.");
      return;
    }
    try {
      const res = await fetch(`${API}/contacts/bulk`, {
        method: "POST",
        headers: { ...authHeaders(token), "Content-Type": "application/json" },
        body: JSON.stringify({ source: "credits", album: albumName, contacts }),
      });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
      setStatusMsg(`Saved ${data.saved} contact${data.saved === 1 ? "" : "s"} from ${albumName} to your Contacts.`);
    } catch (e) {
      setError(e.message);
    }
  }

  const initialParams = new URLSearchParams(window.location.search);
  const initialRole = initialParams.get("role");

  const [albumQuery, setAlbumQuery] = useState(initialParams.get("q") || "");
  const [searchResults, setSearchResults] = useState(null);
  const [selectedAlbum, setSelectedAlbum] = useState(null);
  const [credits, setCredits] = useState(null);
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const [error, setError] = useState(null);
  const [roleFilter, setRoleFilter] = useState(ROLE_FILTERS.includes(initialRole) ? initialRole : "ALL");
  const [token, setToken] = useState(readToken);
  const [deckIndex, setDeckIndex] = useState(0);
  const [apiStatus, setApiStatus] = useState("checking"); // checking | online | offline

  // 1=search, 2=pick album, 3=credits
  const step = selectedAlbum ? 3 : (searchResults || loading) ? 2 : 1;

  // Searches the signed-in account has run before, and the one currently opened as an overview
  const [history, setHistory] = useState([]);
  const [openSearch, setOpenSearch] = useState(null);

  async function loadHistory() {
    if (!token) return;
    try {
      const res = await fetch(`${API}/history`, { headers: authHeaders(token) });
      if (res.ok) setHistory((await res.json()).searches);
    } catch { /* the list just stays as it was */ }
  }

  useEffect(() => { loadHistory(); }, [token]);

  function saveSearch(album, creditList) {
    fetch(`${API}/history`, {
      method: "POST",
      headers: { ...authHeaders(token), "Content-Type": "application/json" },
      body: JSON.stringify({ id: album.id, name: album.name, artist: album.artist, cover_art: album.cover_art, credits: creditList }),
    }).then(loadHistory).catch(() => {});
  }

  async function openHistory(id) {
    try {
      const res = await fetch(`${API}/history/${id}`, { headers: authHeaders(token) });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      setOpenSearch(await res.json());
    } catch (e) {
      setError(e.message);
    }
  }

  useEffect(() => {
    let cancelled = false;
    fetch(`${API}/health`)
      .then(res => { if (!cancelled) setApiStatus(res.ok ? "online" : "offline"); })
      .catch(() => { if (!cancelled) setApiStatus("offline"); });
    return () => { cancelled = true; };
  }, []);

  // One search box: an album, an artist, or both. The server searches in the background; poll until it is done.
  async function runSearch(query) {
    const q = query.trim();
    if (!q) return;
    setUrlParam("q", q);
    setLoading(true);
    setError(null);
    setSearchResults(null);
    setCredits(null);
    setSelectedAlbum(null);
    setStatusMsg("Searching Genius…");
    try {
      const started = await fetch(`${API}/search/start`, {
        method: "POST",
        headers: { ...authHeaders(token), "Content-Type": "application/json" },
        body: JSON.stringify({ q }),
      });
      if (started.status === 401) return signOut(SESSION_EXPIRED);
      if (!started.ok) throw new Error(`Server error ${started.status}`);
      const { job } = await started.json();
      let results = null;
      for (let attempt = 0; attempt < 150 && results === null; attempt++) {
        await new Promise(r => setTimeout(r, 2000));
        const res = await fetch(`${API}/jobs/${job}`, { headers: authHeaders(token) });
        if (res.status === 401) return signOut(SESSION_EXPIRED);
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const state = await res.json();
        if (state.status === "error") throw new Error(state.error);
        if (state.status === "done") results = state.result;
        else setStatusMsg("Searching Genius… the first search for an artist takes a moment.");
      }
      if (results === null) throw new Error("The search is taking too long. Try again in a minute.");
      setSearchResults(results);
      if (results.length === 0) setStatusMsg("No albums found. Try an album name, an artist name, or both.");
      else setStatusMsg(`Found ${results.length} album${results.length !== 1 ? "s" : ""}. Pick one.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  // Re-run the search when the page was opened with ?q= in the URL
  useEffect(() => {
    if (token && albumQuery.trim()) runSearch(albumQuery);
  }, []);

  function handleSearch(e) {
    e.preventDefault();
    runSearch(albumQuery);
  }

  async function handleSelectAlbum(album) {
    setSelectedAlbum(album);
    setLoading(true);
    setError(null);
    setCredits(null);
    setStatusMsg(`Fetching track credits for "${album.name}"… this may take a minute.`);
    try {
      // The lookup runs on the server in the background. Poll its progress until it is done.
      const started = await fetch(`${API}/album/${album.id}/credits/start`, { method: "POST", headers: authHeaders(token) });
      if (started.status === 401) return signOut(SESSION_EXPIRED);
      if (!started.ok) throw new Error(`Server error ${started.status}`);
      const { job } = await started.json();
      let data = null;
      for (let attempt = 0; attempt < 300 && !data; attempt++) {
        await new Promise(r => setTimeout(r, 2000));
        const res = await fetch(`${API}/jobs/${job}`, { headers: authHeaders(token) });
        if (res.status === 401) return signOut(SESSION_EXPIRED);
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const state = await res.json();
        if (state.status === "error") throw new Error(state.error);
        if (state.status === "done") data = state;
        else setStatusMsg(state.total ? `Looking up contacts: ${state.done} of ${state.total} people…` : "Reading the tracklist…");
      }
      if (!data) throw new Error("The lookup is taking too long. Try again in a few minutes.");
      setCredits(data.credits);
      saveSearch(album, data.credits);
      setStatusMsg(`Found ${data.credits.length} credited person${data.credits.length !== 1 ? "s" : ""}.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  function handleBack() {
    setSelectedAlbum(null);
    setCredits(null);
    setError(null);
    setStatusMsg(`Found ${searchResults.length} album${searchResults.length !== 1 ? "s" : ""}. Pick one.`);
  }

  function handleSignedIn(newToken) {
    storeToken(newToken);
    setToken(newToken);
    setError(null);
  }

  function signOut(message = null) {
    storeToken("");
    setToken("");
    setSearchResults(null);
    setSelectedAlbum(null);
    setCredits(null);
    setStatusMsg("");
    setError(message);
  }

  function changeRole(role) {
    setRoleFilter(role);
    setUrlParam("role", role === "ALL" ? "" : role);
  }

  const filteredCredits = credits ? credits.filter(c => {
    if (roleFilter === "ALL") return true;
    return c.roles.some(r => roleClass(r) === roleFilter.toLowerCase());
  }) : [];

  return (
    <>
    {token && (
      <div className="app-bar">
        <div className="app-bar-inner">
          <span className="app-bar-brand">
            <img src="logo.svg" alt="" width="22" height="22" />
            CreditCrate
          </span>
          <a className="app-bar-link" href="settings.html">Settings</a>
          <nav className="tool-nav" aria-label="Apps">
            {DECK_TABS.map((label, i) => (
              <button
                key={label}
                type="button"
                className="tool-tab"
                aria-current={deckIndex === i ? "page" : undefined}
                onClick={() => setDeckIndex(i)}
              >
                {label}
              </button>
            ))}
          </nav>
        </div>
      </div>
    )}
    <div className={token ? "page signed-in" : "page"}>
      <header>
        <h1 className="brand">
          <img className="brand-mark" src="logo.svg" alt="" width="56" height="56" />
          CreditCrate
          <span className="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        </h1>
        <div className="header-actions">
          <div className="header-status" role="status">
            <span className={`status-dot ${apiStatus}`} aria-hidden="true"></span>
            {apiStatus === "online" ? "Service online" : apiStatus === "offline" ? "Service offline" : "Checking service…"}
          </div>
          <p className="tagline">
            Producer credits<br/>
            Public contacts
          </p>
          {token && <button type="button" className="back-btn" onClick={() => signOut()}>Sign out</button>}
        </div>
      </header>

      <main id="main" className={token ? "app-main" : undefined}>
        {error && <div className="error-msg" role="alert">⚠ {error}</div>}

        {token && <OverviewTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} />}
        {token && (
        <AppDeck index={deckIndex} onIndexChange={setDeckIndex}>
        <AppWindow name="Credits"><>
        <CreditsHeader />
        <ol className="step-indicator" aria-label="Progress">
          {STEPS.map(([n, label]) => (
            <li
              key={n}
              className={`step ${step === +n ? "active" : step > +n ? "done" : ""}`}
              aria-current={step === +n ? "step" : undefined}
            >
              <span className="step-num" aria-hidden="true">{step > +n ? "✓" : n}</span>
              {label}
            </li>
          ))}
        </ol>

        <form className="search-block" role="search" onSubmit={handleSearch}>
          <div className="search-row">
            <div className="search-input-wrap">
              <label className="search-label" htmlFor="album-input">Album, artist, or both</label>
              <input
                id="album-input"
                type="text"
                name="album"
                placeholder="e.g. Iceman Drake, or just Drake"
                autoComplete="off"
                spellCheck={false}
                enterKeyHint="search"
                required
                value={albumQuery}
                onChange={e => setAlbumQuery(e.target.value)}
              />
            </div>
            <button
              type="submit"
              className="search-btn"
              disabled={loading || !albumQuery.trim()}
              aria-busy={loading}
            >
              {loading && <span className="spinner" aria-hidden="true" />}
              Search
            </button>
          </div>
        </form>

        <div role="status" aria-live="polite">
          {(loading || statusMsg) && (
            <div className="status-bar">
              {loading && <span className="spinner" aria-hidden="true" />}
              <span>{statusMsg}</span>
            </div>
          )}
        </div>

        {searchResults && searchResults.length > 0 && !selectedAlbum && (
          <ul className="album-results">
            {searchResults.map(alb => (
              <li key={alb.id}>
                <button type="button" className="album-card" onClick={() => handleSelectAlbum(alb)}>
                  {alb.cover_art ? (
                    <img className="album-cover" src={alb.cover_art} alt="" width="220" height="220" loading="lazy" decoding="async" />
                  ) : (
                    <div className="album-cover-placeholder" aria-hidden="true">♪</div>
                  )}
                  <span className="album-info">
                    <span className="album-name">{alb.name}</span>
                    <span className="album-artist">{alb.artist}</span>
                  </span>
                </button>
              </li>
            ))}
          </ul>
        )}

        {credits && credits.length > 0 && (
          <section aria-labelledby="credits-heading">
            <div className="credits-header">
              <button type="button" className="back-btn" onClick={handleBack} disabled={loading}>← Results</button>
              <h2 id="credits-heading" className="credits-title">{selectedAlbum.name}</h2>
              <div className="filter-row" role="group" aria-label="Filter by role">
                {ROLE_FILTERS.map(f => (
                  <button
                    type="button"
                    key={f}
                    className={`filter-btn ${roleFilter === f ? "active" : ""}`}
                    aria-pressed={roleFilter === f}
                    onClick={() => changeRole(f)}
                  >
                    {filterLabel(f)}
                  </button>
                ))}
              </div>
              <button
                type="button"
                className="export-btn"
                onClick={() => csvExport(filteredCredits, selectedAlbum.name)}
                disabled={filteredCredits.length === 0}
              >
                <span aria-hidden="true">↓</span> Export CSV
              </button>
              <button
                type="button"
                className="back-btn"
                onClick={() => saveToContacts(selectedAlbum.name, credits)}
                disabled={credits.length === 0}
              >
                Save emails to Contacts
              </button>
            </div>

            {filteredCredits.length === 0 ? (
              <p className="inline-empty">
                No {roleFilter.toLowerCase()} credits on this album.
                <button type="button" className="filter-btn" onClick={() => changeRole("ALL")}>Show all</button>
              </p>
            ) : (
              <div className="table-wrap">
                <table className="credits-table">
                  <caption className="sr-only">Credits for {selectedAlbum.name}</caption>
                  <thead>
                    <tr>
                      <th scope="col">Name</th>
                      <th scope="col">Roles</th>
                      <th scope="col">Tracks</th>
                      <th scope="col">Instagram</th>
                      <th scope="col">Email</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredCredits.map((c, i) => (
                      <CreditRow key={c.name} credit={c} delay={i * 30} album={selectedAlbum.name} token={token} />
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </section>
        )}

        {credits && credits.length === 0 && !loading && (
          <div className="empty-state">
            <span className="big" aria-hidden="true">∅</span>
            <p>No credits found for this album on Genius.</p>
            <button type="button" className="back-btn" onClick={handleBack}>← Back to results</button>
          </div>
        )}

        <section className="history" aria-labelledby="history-heading">
          <div className="history-head">
            <h2 id="history-heading" className="history-title">Recent searches</h2>
            <span className="history-count">{history.length} {history.length === 1 ? "album" : "albums"}</span>
          </div>

          {history.length === 0 ? (
            <p className="inline-empty">Albums you search for will show up here, with the emails found for each.</p>
          ) : (
            <ul className="history-grid">
              {history.map(s => (
                <li key={s.id}>
                  <button
                    type="button"
                    className={`history-card${openSearch?.id === s.id ? " is-open" : ""}`}
                    aria-pressed={openSearch?.id === s.id}
                    onClick={() => openHistory(s.id)}
                  >
                    {s.cover_art ? (
                      <img className="history-cover" src={s.cover_art} alt="" width="64" height="64" loading="lazy" decoding="async" />
                    ) : (
                      <span className="history-cover history-cover-empty" aria-hidden="true">♪</span>
                    )}
                    <span className="history-info">
                      <span className="history-name">{s.name}</span>
                      <span className="history-artist">{s.artist}</span>
                      <span className="history-meta">{s.emails} of {s.people} with email</span>
                    </span>
                  </button>
                </li>
              ))}
            </ul>
          )}

          {openSearch && (
            <div className="history-overview">
              <div className="credits-header">
                <h3 className="credits-title">{openSearch.name}</h3>
                <span className="history-meta">
                  {openSearch.credits.filter(c => c.instagram_data?.email).length} of {openSearch.credits.length} with email
                </span>
                <button
                  type="button"
                  className="export-btn"
                  onClick={() => csvExport(openSearch.credits, openSearch.name)}
                  disabled={openSearch.credits.length === 0}
                >
                  <span aria-hidden="true">↓</span> Export CSV
                </button>
                <button type="button" className="back-btn" onClick={() => saveToContacts(openSearch.name, openSearch.credits)}>
                  Save emails to Contacts
                </button>
                <button type="button" className="back-btn" onClick={() => setOpenSearch(null)}>Close</button>
              </div>
              {openSearch.credits.length === 0 ? (
                <p className="inline-empty">No credits were found for this album.</p>
              ) : (
                <div className="table-wrap">
                  <table className="credits-table">
                    <caption className="sr-only">Credits for {openSearch.name}</caption>
                    <thead>
                      <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Roles</th>
                        <th scope="col">Tracks</th>
                        <th scope="col">Instagram</th>
                        <th scope="col">Email</th>
                      </tr>
                    </thead>
                    <tbody>
                      {openSearch.credits.map((c, i) => (
                        <CreditRow key={c.name} credit={c} delay={i * 30} album={openSearch.name} token={token} />
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </section>

        </></AppWindow>}

        {token && <AppWindow name="Contacts"><ContactsTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Packs"><PacksTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Inbox"><InboxTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Campaigns"><CampaignsTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} /></AppWindow>}
        {token && <AppWindow name="Deal Desk"><DealDeskTool /></AppWindow>}
        </AppDeck>
        )}

        {!token && <>
          <section className="hero" aria-labelledby="hero-heading">
            <p className="eyebrow">Free for 7 days</p>
            <h2 id="hero-heading" className="hero-title">Everything you do outside your DAW.</h2>
            <p className="hero-copy">
              You already make the music. Let’s get it to the people who need to hear it.
            </p>
            <AuthPanel onSignedIn={handleSignedIn} />
          </section>
          <Features />
          <LandingExtras />
        </>}
      </main>

      <footer className="site-footer">
        <div className="site-footer-row">
          <span>CreditCrate © 2026 · <a href="pricing.html">Pricing</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></span>
        </div>
      </footer>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
