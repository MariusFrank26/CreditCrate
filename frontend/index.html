<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Search an album and see every producer, engineer and mixer behind it, with their Instagram and public contact email." />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#08090a" />
<title>CreditCrate — Album Production Lookup</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    /* Five pastel hues. Everything else is the grey ground and ink. */
    --sunshine: #f3d58b;
    --lilac: #c9b6ee;
    --sky: #a9d8ef;
    --mint: #a3ddc2;
    --salmon: #f2a79c;
    /* Surfaces */
    --void: #08090a;
    --carbon: #0f1011;
    --obsidian: #161718;
    --graphite: #23252a;
    --smoke: #383b3f;
    /* Text */
    --ash: #62666d;
    --fog: #8a8f98;
    --mist: #d0d6e0;
    --paper: #ffffff;
    /* Accents: acid lime is reserved for the single primary action */
    --acid: #f3d58b;
    --pulse: #a3ddc2;
    --coral: #f2a79c;
    --teal: #a9d8ef;
    --iris: #a9d8ef;
    --lavender: #c9b6ee;

    --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--mist);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.011em;
    font-feature-settings: "cv01", "ss03", "zero";
  }

  #root { min-height: 100vh; }

  a, button, input { touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .skip-link {
    position: absolute; top: -100px; left: 16px; z-index: 10;
    background: var(--paper); color: var(--void); font-size: 13px; font-weight: 510;
    padding: 8px 12px; border-radius: 6px; text-decoration: none;
  }
  .skip-link:focus { top: 16px; }

  /* ── LAYOUT ── */
  .page { max-width: none; margin: 0 auto; padding: 0 32px 96px; }

  /* ── HEADER ── */
  header {
    padding: 56px 0 32px;
    border-bottom: 1px solid var(--graphite);
    margin-bottom: 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 510;
    font-size: clamp(32px, 4.5vw, 44px);
    letter-spacing: -0.022em;
    line-height: 1;
    color: var(--paper);
  }
  .brand-mark { display: block; width: clamp(44px, 5vw, 56px); height: auto; }
  .header-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .tagline {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ash);
    text-align: right;
    line-height: 1.6;
  }

  /* ── STEP INDICATORS ── */
  .step-indicator {
    list-style: none;
    display: flex;
    margin-bottom: 32px;
    border: 1px solid var(--graphite);
    border-radius: 12px;
    overflow: hidden;
  }
  .step {
    flex: 1;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--ash);
    border-right: 1px solid var(--graphite);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step:last-child { border-right: none; }
  .step.active { color: var(--paper); }
  .step.done { color: var(--mist); }
  .step-num {
    width: 18px; height: 18px;
    border: 1px solid currentColor;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }

  /* ── SEARCH BAR ── */
  .search-block { margin-bottom: 48px; }
  .search-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .search-input-wrap { position: relative; flex: 1; }
  .search-input-artist { max-width: 260px; }
  .search-label {
    display: block;
    font-size: 13px;
    color: var(--fog);
    margin-bottom: 8px;
  }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    color: var(--mist);
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: -0.011em;
    padding: 12px 14px;
    transition: border-color .15s;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus { border-color: var(--mist); }
  input[type="text"]::placeholder, input[type="email"]::placeholder { color: var(--ash); }

  .search-btn {
    display: flex; align-items: center; gap: 10px;
    height: 48px;
    background: var(--paper);
    color: var(--void);
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 510;
    letter-spacing: -0.011em;
    padding: 0 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: filter .15s;
  }
  .search-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .search-btn .spinner { border-color: rgba(0, 0, 0, 0.25); border-top-color: var(--void); }

  /* ── ALBUM RESULTS ── */
  .album-results {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
  }
  .album-card {
    display: block;
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 12px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s;
  }
  .album-card:hover { border-color: var(--smoke); }
  .album-cover {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--obsidian);
  }
  .album-cover-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: var(--obsidian);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--ash);
  }
  .album-info { display: block; padding: 12px 16px 16px; }
  .album-name {
    display: block;
    font-size: 15px;
    font-weight: 510;
    letter-spacing: -0.011em;
    color: var(--paper);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .album-artist { display: block; font-size: 13px; color: var(--fog); }

  /* ── CREDITS ── */
  .credits-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .credits-title {
    font-size: 32px;
    font-weight: 510;
    letter-spacing: -0.022em;
    line-height: 1.13;
    color: var(--paper);
  }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn, .export-btn, .back-btn, .email-copy, .demo-toggle {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: -0.011em;
    background: transparent;
    border: 1px solid var(--graphite);
    border-radius: 6px;
    color: var(--mist);
    padding: 6px 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background-color .15s;
  }
  .filter-btn:hover, .export-btn:hover:not(:disabled), .back-btn:hover:not(:disabled), .email-copy:hover, .demo-toggle:hover {
    border-color: var(--smoke);
    color: var(--paper);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--obsidian);
    border-color: var(--smoke);
    color: var(--paper);
  }
  .export-btn { margin-left: auto; }
  .export-btn:disabled, .back-btn:disabled { opacity: .4; cursor: not-allowed; }
  .back-btn { color: var(--fog); }

  .table-wrap { overflow-x: auto; }
  .credits-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0 4px;
    text-align: left;
  }
  .credits-table th:nth-child(1) { width: 200px; }
  .credits-table th:nth-child(3) { width: 130px; }
  .credits-table th:nth-child(4) { width: 200px; }
  .credits-table th:nth-child(5) { width: 260px; }
  .credits-table thead th {
    font-size: 12px;
    font-weight: 400;
    color: var(--ash);
    padding: 0 16px 8px;
  }

  .credit-row { animation: fadeIn .3s ease both; }
  .credit-row > * {
    background: var(--carbon);
    border-top: 1px solid var(--graphite);
    border-bottom: 1px solid var(--graphite);
    transition: background-color .15s;
  }
  .credit-row > :first-child { border-left: 1px solid var(--graphite); border-radius: 12px 0 0 12px; }
  .credit-row > :last-child { border-right: 1px solid var(--graphite); border-radius: 0 12px 12px 0; }
  .credit-row:hover > * { background: var(--obsidian); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cell {
    padding: 12px 16px;
    font-size: 13px;
    vertical-align: middle;
    overflow: hidden;
  }
  .cell-name { font-size: 14px; font-weight: 510; color: var(--paper); }
  .role-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .role-tag {
    font-size: 12px;
    line-height: 20px;
    padding: 0 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--fog);
    white-space: nowrap;
  }
  .role-tag.producer { color: var(--lilac); background: rgba(201, 182, 238, .14); }
  .role-tag.engineer { color: var(--sky); background: rgba(169, 216, 239, .14); }
  .role-tag.mixer { color: var(--mint); background: rgba(163, 221, 194, .14); }
  .role-tag.writer { color: var(--sunshine); background: rgba(243, 213, 139, .14); }

  .ig-link {
    color: var(--mist);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ig-link:hover { color: var(--paper); text-decoration: underline; }
  .ig-icon { flex-shrink: 0; }

  .email-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .email-val {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--mist);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .email-val.none { color: var(--ash); font-family: var(--sans); font-style: italic; }
  .email-copy { padding: 2px 8px; font-size: 12px; flex-shrink: 0; }

  .muted-dash { color: var(--ash); font-family: var(--mono); font-size: 12px; }

  .songs-count { font-size: 13px; color: var(--fog); font-variant-numeric: tabular-nums; }
  .songs-count strong { color: var(--mist); font-weight: 510; }

  .inline-empty { font-size: 14px; color: var(--fog); padding: 24px 0; }
  .inline-empty button { margin-left: 8px; }

  /* ── STATUS / LOADER ── */
  .status-bar {
    font-size: 13px;
    color: var(--fog);
    padding: 16px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--graphite);
    border-top-color: var(--mist);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(242, 167, 156, 0.08);
    border: 1px solid rgba(242, 167, 156, 0.4);
    border-radius: 6px;
    color: var(--salmon);
    font-size: 13px;
    padding: 12px 16px;
    margin: 16px 0;
  }

  .empty-state {
    text-align: center;
    padding: 96px 0;
    color: var(--fog);
    font-size: 14px;
    text-wrap: balance;
  }
  .empty-state .big { display: block; font-size: 48px; font-weight: 510; color: var(--smoke); margin-bottom: 16px; }
  .empty-state .back-btn { margin-top: 20px; }

  /* ── EXPLAINER (landing) ── */
  .explainer { padding: 56px 0 0; }
  .section-title { font-size: 28px; font-weight: 510; letter-spacing: -0.02em; line-height: 1.2; color: var(--paper); }
  .how-steps {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    margin: 24px 0 40px;
  }
  .how-step .num { font-family: var(--mono); font-size: 12px; color: var(--ash); }
  .how-step-title { margin-top: 8px; font-size: 16px; font-weight: 510; color: var(--paper); }
  .how-step-desc { margin-top: 6px; font-size: 14px; color: var(--fog); }
  .explainer > * {
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--i, 0) * 120ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* ── NEWSLETTER + SIGN-IN PANELS ── */
  .panel {
    max-width: 560px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--graphite);
  }
  .panel-title { font-size: 20px; font-weight: 510; letter-spacing: -0.016em; color: var(--paper); }
  .panel-copy { margin-top: 8px; font-size: 14px; color: var(--fog); }
  .panel-form { margin-top: 20px; }

  /* ── TOOLS (title bar and tool screens) ── */
  .tool-section { margin-top: 32px; display: flex; flex-direction: column; gap: 20px; }
  .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .tool-card {
    display: flex; flex-direction: column; gap: 16px;
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 8px;
    padding: 28px;
    min-width: 0;
  }
  .tool-card-wide { max-width: 720px; }
  .tool-card-title { font-size: 15px; font-weight: 510; color: var(--paper); }
  .tool-filter { align-items: flex-end; }
  .tool-file-label { display: inline-flex; align-self: flex-start; cursor: pointer; }
  .tool-preview { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--graphite); padding-top: 16px; }
  .tool-preview p { font-size: 14px; color: var(--mist); }
  .tool-preview strong { color: var(--paper); font-weight: 510; }
  .tool-frame {
    width: 100%; height: calc(100vh - 220px); min-height: 640px;
    border: 1px solid var(--graphite); border-radius: 8px;
    background: var(--void);
  }
  textarea, select {
    width: 100%;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    color: var(--mist);
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: -0.011em;
    padding: 12px 14px;
  }
  textarea { resize: vertical; }
  select option { background: var(--obsidian); }
  textarea:focus, select:focus { outline: none; border-color: var(--mist); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data-table th {
    text-align: left; font-size: 12px; font-weight: 510; color: var(--fog);
    padding: 10px 12px; border-bottom: 1px solid var(--graphite);
  }
  .data-table td {
    padding: 12px; border-bottom: 1px solid var(--graphite);
    color: var(--mist); vertical-align: middle; overflow-wrap: anywhere;
  }
  .data-table .cell-link { color: var(--fog); }
  @media (max-width: 760px) {
    .tool-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* ── APP BAR: the tool title bar, sticky across the top once signed in ── */
  .app-bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(22, 23, 24, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--smoke);
    box-shadow: inset 0 -1px 0 rgba(243, 213, 139, 0.12);
  }
  .app-bar-inner {
    max-width: none; margin: 0 auto;
    padding: 10px 24px;
    display: flex; align-items: center; gap: 28px;
  }
  .app-bar-link { margin-left: auto; font-size: 13px; color: var(--fog); text-decoration: none; }
  .app-bar-link:hover { color: var(--paper); }
  .app-bar-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 510; letter-spacing: -0.016em;
    color: var(--paper);
    white-space: nowrap;
  }
  @media (max-width: 760px) {
    .app-bar-inner { padding: 10px 16px; gap: 16px; }
    .app-bar-brand { display: none; }
  }
  .tool-nav {
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tool-nav::-webkit-scrollbar { display: none; }
  .tool-tab {
    font-family: var(--sans);
    font-size: 14px; font-weight: 510;
    letter-spacing: -0.011em;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--fog);
    padding: 8px 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, background-color .15s, border-color .15s;
  }
  .tool-tab:hover { color: var(--paper); background: var(--obsidian); }
  .tool-tab[aria-current="page"] {
    background: var(--sunshine);
    border-color: var(--sunshine);
    color: var(--void);
  }
  .tool-tab:focus-visible { outline-offset: 0; }

  /* ── POLISH: signed-in screens ── */
  .signed-in header { display: flex; justify-content: flex-end; align-items: center; padding-top: 20px; padding-bottom: 20px; }
  .signed-in header .brand, .signed-in .tagline { display: none; }
  .signed-in .header-actions { flex-direction: row; align-items: center; gap: 16px; }
  .tool-heading { display: flex; flex-direction: column; gap: 8px; }
  .tool-eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sunshine); }
  .tool-title { font-size: 30px; font-weight: 510; line-height: 1.15; letter-spacing: -0.022em; color: var(--paper); }
  .tool-copy { font-size: 15px; line-height: 1.55; color: var(--fog); max-width: 640px; }
  .tool-empty {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
    padding: 48px 24px;
    border: 1px dashed var(--smoke); border-radius: 10px;
  }
  .tool-empty-title { font-size: 16px; font-weight: 510; color: var(--paper); }
  .tool-empty-copy { font-size: 14px; color: var(--fog); }
  .tool-loading { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fog); padding: 24px 0; }
  .stat-tile { position: relative; overflow: hidden; }
  .stat-tile::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: var(--accent, var(--graphite));
  }
  .stat-tile.accent-teal { --accent: var(--sky); }
  .stat-tile.accent-lavender { --accent: var(--lilac); }
  .stat-tile.accent-iris { --accent: var(--sky); }
  .quick-action { position: relative; transition: border-color .15s, background-color .15s, transform .15s; }
  .quick-action:hover { transform: translateY(-1px); }
  .quick-arrow { position: absolute; top: 18px; right: 18px; color: var(--ash); transition: color .15s, transform .15s; }
  .quick-action:hover .quick-arrow { color: var(--sunshine); transform: translateX(3px); }
  .data-table tbody tr { transition: background-color .15s; }
  .data-table tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .tool-section { gap: 36px; }
  .tool-card { gap: 22px; background: var(--carbon); }
  .check-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fog); cursor: pointer; }
  .check-row input { width: 16px; height: 16px; accent-color: var(--sunshine); }
  .campaign-stats { display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--graphite); padding-top: 16px; }
  .stat-grid-compact { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .stat-grid-compact .stat-value { font-size: 28px; }
  .quick-copy { font-size: 13px; color: var(--fog); }

  /* ── LANDING: features and pipeline (visitors before sign-in) ── */
  .features { margin-top: 96px; }
  .features-title {
    margin-top: 12px;
    font-size: clamp(30px, 4vw, 44px); font-weight: 510; line-height: 1.1;
    letter-spacing: -0.03em; color: var(--paper);
  }
  .feature-grid {
    margin-top: 40px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px;
  }
  .feature-card { grid-column: span 2; }
  @media (max-width: 760px) {
    .feature-grid { grid-template-columns: minmax(0, 1fr); }
    .feature-card { grid-column: auto; }
  }
  .feature-card {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--carbon);
    border: 1px solid var(--graphite); border-radius: 12px;
    padding: 22px;
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: var(--d, 0ms);
    transition: border-color .2s, transform .2s;
  }
  .feature-card:hover { border-color: var(--smoke); transform: translateY(-3px); }
  .feature-number { font-family: var(--mono); font-size: 12px; color: var(--sunshine); letter-spacing: .08em; }
  .feature-title { font-size: 17px; font-weight: 510; letter-spacing: -0.016em; color: var(--paper); }
  .feature-copy { font-size: 14px; line-height: 1.55; color: var(--fog); }

  .fx-art {
    height: 112px; margin: 4px 0 6px;
    border-radius: 8px; background: var(--void);
    border: 1px solid var(--graphite);
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 14px; overflow: hidden; position: relative;
  }
  /* credits: equalizer */
  .fx-credits { align-items: flex-end; gap: 6px; padding: 18px 22px; }
  .fx-credits span {
    width: 8px; height: 100%; border-radius: 3px;
    background: linear-gradient(180deg, var(--mist), var(--smoke));
    opacity: .9;
    transform-origin: bottom;
    animation: fx-eq 1.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * -0.18s);
  }
  @keyframes fx-eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  /* contacts: rows of people */
  .fx-contacts { flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; }
  .fx-person {
    display: flex; align-items: center; gap: 10px;
    animation: fx-slide-in .6s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--i) * .18s + .2s);
  }
  .fx-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px; color: var(--void);
    background: var(--mint);
    color: var(--void);
  }
  .fx-person:nth-child(2) .fx-avatar { background: var(--lilac); }
  .fx-person:nth-child(3) .fx-avatar { background: var(--sky); }
  .fx-line { flex: 1; height: 1px; background: var(--graphite); }
  .fx-tag {
    font-family: var(--mono); font-size: 10px; color: var(--fog);
    border: 1px solid var(--smoke); border-radius: 999px; padding: 2px 8px;
  }
  @keyframes fx-slide-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  /* packs: stacked cards */
  .fx-packs { justify-content: center; }
  .fx-pack {
    position: absolute; width: 60%; height: 64px; border-radius: 8px;
    border: 1px solid var(--smoke); background: var(--obsidian);
  }
  .fx-pack-back { transform: translate(-10px, 8px) rotate(-4deg); opacity: .6; }
  .fx-pack-front {
    display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 14px;
    transform: rotate(2deg);
    animation: fx-float 3.6s ease-in-out infinite;
    border-color: var(--sunshine);
  }
  .fx-pack-name { font-size: 13px; font-weight: 510; color: var(--paper); }
  .fx-pack-link { font-family: var(--mono); font-size: 11px; color: var(--sky); }
  @keyframes fx-float { 0%, 100% { transform: rotate(2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-6px); } }
  /* campaigns: filling bars */
  .fx-campaign { flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; }
  .fx-bar-label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--fog); }
  .fx-bar { height: 8px; border-radius: 999px; background: var(--graphite); overflow: hidden; margin-bottom: 6px; }
  .fx-bar span {
    display: block; height: 100%; width: 62%; border-radius: 999px;
    background: linear-gradient(90deg, var(--lilac), var(--sky));
    transform-origin: left;
    animation: fx-fill 2.8s cubic-bezier(.2, .7, .2, 1) infinite alternate;
  }
  .fx-bar-click span { width: 18%; background: var(--mint); animation-delay: .4s; }
  @keyframes fx-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  /* deal desk: invoice lines */
  .fx-invoice { flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; }
  .fx-invoice-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mist);
    animation: rise .5s both; animation-delay: calc(var(--i) * .2s + .15s);
  }
  .fx-invoice-total {
    display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px;
    color: var(--paper); border-top: 1px solid var(--smoke); padding-top: 8px; margin-top: 2px;
  }

  /* pipeline */
  .pipeline { margin-top: 96px; }
  .pipeline-title { font-size: 22px; font-weight: 510; letter-spacing: -0.02em; color: var(--paper); }
  .pipeline-steps {
    list-style: none; margin-top: 32px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px;
    position: relative;
  }
  .pipeline-steps::before {
    content: ""; position: absolute; left: 18px; right: 18px; top: 17px; height: 2px;
    background: linear-gradient(90deg, var(--sunshine), var(--lilac), var(--sky), var(--mint));
    background-size: 200% 100%;
    opacity: .5;
    animation: fx-flow 4s linear infinite;
  }
  @keyframes fx-flow { to { background-position: -200% 0; } }
  .pipeline-step {
    position: relative; display: flex; flex-direction: column; gap: 6px;
    animation: rise .6s both; animation-delay: var(--d, 0ms);
  }
  .pipeline-dot {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--void); border: 1px solid var(--smoke);
    font-family: var(--mono); font-size: 13px; color: var(--paper);
    margin-bottom: 8px;
  }
  .pipeline-name { font-size: 15px; font-weight: 510; color: var(--paper); }
  .pipeline-copy { font-size: 13px; color: var(--fog); }

  @media (prefers-reduced-motion: reduce) {
    .feature-card, .fx-art *, .pipeline-step, .pipeline-steps::before { animation: none !important; transition: none !important; }
  }

  /* ── HUB: the landing page's energy, carried into the signed-in tools ── */
  .signed-in::before {
    content: ""; position: fixed; inset: -20% -10% auto -10%; height: 70vh; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 50% at 20% 30%, rgba(169, 216, 239, .16), transparent 70%),
      radial-gradient(35% 45% at 80% 20%, rgba(169, 216, 239, .12), transparent 70%);
    animation: hub-drift 18s ease-in-out infinite alternate;
  }
  @keyframes hub-drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(3%, 4%, 0); } }
  .tool-section > * { animation: hub-rise .6s cubic-bezier(.2, .7, .2, 1) both; }
  .tool-section > *:nth-child(2) { animation-delay: .06s; }
  .tool-section > *:nth-child(3) { animation-delay: .12s; }
  .tool-section > *:nth-child(4) { animation-delay: .18s; }
  @keyframes hub-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .tool-title {
    background: linear-gradient(90deg, var(--paper) 30%, var(--sky) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tool-eyebrow { display: inline-flex; align-items: center; gap: 8px; }
  .tool-eyebrow::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--sky); box-shadow: 0 0 0 0 rgba(169, 216, 239, .6);
    animation: hub-pulse 2.2s ease-out infinite;
  }
  @keyframes hub-pulse { 0% { box-shadow: 0 0 0 0 rgba(169, 216, 239, .6); } 70%, 100% { box-shadow: 0 0 0 8px rgba(169, 216, 239, 0); } }
  .tool-card, .search-block, .stat-tile, .quick-action, .tool-empty {
    background: var(--carbon);
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .tool-card:hover, .stat-tile:hover {
    border-color: var(--smoke);
    box-shadow: 0 12px 32px -18px rgba(169, 216, 239, .45);
  }
  .stat-tile:hover { transform: translateY(-2px); }
  .stat-value { font-variant-numeric: tabular-nums; }
  .search-block { animation: hub-rise .6s cubic-bezier(.2, .7, .2, 1) both; }
  .data-table tbody tr:hover td { background: rgba(169, 216, 239, .06); }
  .tool-tab[aria-current="page"] { box-shadow: 0 6px 18px -8px rgba(243, 213, 139, .6); }
  @media (prefers-reduced-motion: reduce) {
    .signed-in::before, .tool-section > *, .search-block, .tool-eyebrow::before { animation: none !important; }
  }

  /* ── APP WINDOWS: each signed-in tool is an app inside the site ── */
  .app-window {
    position: relative;
    margin-top: 32px;
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 80px -40px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .02) inset;
    animation: ios-fade .5s ease-out both;
  }
  .app-window-bar {
    display: flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 16px;
    background: var(--obsidian);
    border-bottom: 1px solid var(--graphite);
  }
  .app-window-dots { display: flex; gap: 7px; margin-right: 6px; }
  .app-window-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--smoke); }
  .app-window-dots i:nth-child(1) { background: var(--salmon); }
  .app-window-dots i:nth-child(2) { background: var(--sunshine); }
  .app-window-dots i:nth-child(3) { background: var(--mint); }
  .app-window-name { font-size: 13px; font-weight: 510; color: var(--mist); letter-spacing: -0.011em; }
  .app-window-body { padding: 40px 44px 48px; }
  .app-window-body .tool-section { margin-top: 0; }
  @media (max-width: 760px) {
    .app-window { border-radius: 14px; }
    .app-window-body { padding: 20px 16px 28px; }
  }

  /* ── APP GRID: two apps side by side on wide screens ── */
  .app-main {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 32px; align-items: start;
  }
  .app-main > .error-msg { grid-column: 1 / -1; }
  .app-main > .app-window { margin-top: 0; }
  @media (max-width: 900px) {
    .app-main { grid-template-columns: minmax(0, 1fr); }
  }

  /* ── CONTACTS: an iPhone-style list ── */
  .ios { display: flex; flex-direction: column; gap: 14px; }
  .ios-large-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .ios-count { font-size: 13px; color: var(--fog); }
  .ios-title { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; color: var(--paper); }
  .ios-add {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--paper); color: var(--void);
    font-size: 24px; line-height: 1; font-weight: 400;
    display: grid; place-items: center; flex: none;
    transition: transform .15s, filter .15s;
  }
  .ios-add:hover { filter: brightness(1.05); }
  .ios-add:active { transform: scale(.94); }
  .ios-search {
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 12px;
    background: rgba(255, 255, 255, .07);
    border-radius: 10px;
    color: var(--fog);
  }
  .ios-search input {
    flex: 1; min-width: 0; border: none; background: transparent; padding: 0;
    font-size: 16px; color: var(--paper);
  }
  .ios-search input:focus { outline: none; }
  .ios-search input::placeholder { color: var(--ash); }
  .ios-section { display: flex; flex-direction: column; gap: 6px; }
  .ios-letter {
    font-size: 13px; font-weight: 600; color: var(--fog);
    padding: 8px 4px 0;
    position: sticky; top: 64px; z-index: 2;
    background: var(--carbon);
  }
  .ios-group {
    list-style: none;
    background: var(--obsidian);
    border-radius: 12px;
    overflow: hidden;
  }
  .ios-group li + li::before {
    content: ""; display: block; height: 1px; margin-left: 60px;
    background: rgba(255, 255, 255, .07);
  }
  .ios-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 14px;
    background: none; border: none; color: inherit; text-align: left; cursor: pointer;
    transition: background-color .15s;
  }
  .ios-row:hover { background: rgba(255, 255, 255, .03); }
  .ios-row:active { background: rgba(255, 255, 255, .06); }
  .ios-row-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .ios-name { font-size: 16px; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ios-sub { font-size: 13px; color: var(--fog); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ios-chevron { font-size: 22px; color: var(--ash); line-height: 1; }
  .ios-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600; color: var(--paper);
    letter-spacing: .02em;
  }
  .ios-avatar-xl { width: 76px; height: 76px; font-size: 26px; }
  .ios-none { font-size: 15px; color: var(--fog); padding: 24px 4px; }
  .ios-sheet-wrap { position: fixed; inset: 0; z-index: 60; }
  .ios-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); animation: ios-fade .2s ease-out both; }
  .ios-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 88vh; overflow-y: auto;
    background: var(--obsidian);
    border-radius: 20px 20px 0 0;
    padding: 10px 20px 28px;
    display: flex; flex-direction: column; gap: 16px;
    animation: ios-sheet-up .36s cubic-bezier(.2, .8, .2, 1) both;
  }
  @media (min-width: 760px) {
    .ios-sheet { left: 50%; right: auto; width: 480px; margin-left: -240px; bottom: 24px; border-radius: 20px; }
  }
  /* Pop-ups inside an app are centred on that app's frame, not on the whole page */
  .app-window .ios-sheet-wrap { position: absolute; inset: 0; z-index: 60; border-radius: inherit; overflow: hidden; }
  .app-window .ios-sheet {
    top: 50%; bottom: auto; left: 50%; right: auto; margin: 0;
    transform: translate(-50%, -50%);
    width: min(520px, calc(100% - 32px)); max-height: calc(100% - 32px);
    overflow-y: auto;
    border-radius: 20px; padding: 24px 24px 28px;
    animation: ios-fade .25s ease-out both;
  }
  .app-window .ios-sheet .ios-handle { display: none; }
  .dbx-choose {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 16px; border: 0; border-radius: 12px;
    background: #1a5bc4; color: #ffffff;
    font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: -0.011em;
    cursor: pointer; transition: background-color .15s;
  }
  .dbx-choose:hover:not(:disabled) { background: #154caa; }
  .dbx-choose:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  .dbx-choose:disabled { opacity: .6; cursor: default; }
  .dbx-or { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  .dbx-or::before, .dbx-or::after { content: ""; flex: 1; height: 1px; background: var(--graphite); }
  .ios-handle { width: 40px; height: 5px; border-radius: 999px; background: var(--smoke); align-self: center; }
  .ios-sheet-title { font-size: 20px; font-weight: 600; color: var(--paper); text-align: center; }
  .ios-profile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; }
  .ios-profile .ios-sub { text-align: center; }
  .ios-detail {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 12px 14px; font-size: 15px;
  }
  .ios-detail + .ios-detail { border-top: 1px solid rgba(255, 255, 255, .07); }
  .ios-detail span:first-child { color: var(--fog); }
  .ios-detail span:last-child { color: var(--paper); text-align: right; overflow-wrap: anywhere; }
  .ios-action {
    display: block; text-align: center; text-decoration: none;
    padding: 14px; border-radius: 12px;
    background: var(--paper); color: var(--void);
    font-size: 16px; font-weight: 510;
  }
  .ios-action-quiet { background: var(--graphite); color: var(--paper); border: none; cursor: pointer; font-family: var(--sans); }
  .ios-form { display: flex; flex-direction: column; gap: 14px; }
  .ios-divider { height: 1px; background: var(--graphite); }
  @keyframes ios-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ios-sheet-up { from { transform: translateY(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .app-window, .ios-backdrop, .ios-sheet { animation: none !important; }
  }

  /* ── HOMOGENEOUS: one neutral system, matching Deal Desk. Lime is for primary actions only ── */
  .signed-in::before { display: none; }
  .app-window, .tool-card, .stat-tile, .search-block, .tool-empty {
    background: var(--carbon);
    box-shadow: none;
  }
  .app-window { box-shadow: none; }
  .app-window-bar { background: var(--obsidian); }
  .stat-tile::before { display: none; }
  .stat-tile:hover, .tool-card:hover { transform: none; box-shadow: none; border-color: var(--smoke); }
  .tool-title, .dash-title {
    background: none; color: var(--paper);
    -webkit-text-fill-color: var(--paper);
    font-size: 24px; letter-spacing: -0.016em;
  }
  .tool-eyebrow, .eyebrow { color: var(--ash); }
  .tool-eyebrow::before { display: none; }
  .data-table tbody tr:hover td { background: rgba(255, 255, 255, .02); }
  .ios-group { background: var(--obsidian); }
  .dash-pack-icon { background: var(--graphite); color: var(--fog); }
  .dash-meter-track { background: var(--graphite); }
  .dash-meter-label { color: var(--fog); }
  .tool-tab, .app-bar { box-shadow: none; }

  /* ── CREDITS HEADER: the Deal Desk top, with a drifting grid, an animated mark and a sweeping hairline ── */
  .cc-head {
    position: relative; overflow: hidden;
    margin: -28px -28px 28px;
    padding: 30px 28px 26px;
    border-bottom: 1px solid var(--graphite);
  }
  .cc-head::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(208, 214, 224, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(208, 214, 224, .035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 90% at 30% 0%, #000 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 30% 0%, #000 20%, transparent 80%);
    animation: drift 12s linear infinite;
  }
  .cc-head::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--paper), transparent) 0 0 / 200% 100%;
    opacity: .35;
    animation: line-sweep 5s linear infinite;
  }
  .cc-brand-row { position: relative; display: flex; align-items: center; gap: 16px; animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }
  .cc-mark { width: 52px; height: 52px; flex-shrink: 0; color: var(--mist); }
  .cc-mark .cc-trace { stroke: var(--sunshine); stroke-dasharray: 8 96; animation: cc-trace 3.2s linear infinite; }
  @keyframes cc-trace { to { stroke-dashoffset: -104; } }
  .cc-titles { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .cc-eyebrow { font-family: var(--mono); font-size: 12px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  .cc-eyebrow::after { content: "_"; margin-left: 2px; color: var(--mist); animation: blink 1s steps(1) infinite; }
  .cc-title { font-size: 24px; font-weight: 510; letter-spacing: -0.016em; line-height: 1.2; color: var(--paper); }
  .cc-eq { display: flex; align-items: flex-end; gap: 3px; height: 22px; margin-left: auto; }
  .cc-eq span { width: 3px; height: 100%; border-radius: 2px; background: var(--sky); transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
  .cc-eq span:nth-child(2) { animation-delay: -.3s; }
  .cc-eq span:nth-child(3) { animation-delay: -.6s; }
  .cc-eq span:nth-child(4) { animation-delay: -.2s; }
  .cc-eq span:nth-child(5) { animation-delay: -.8s; }

  /* ── EXAMPLES: faded placeholders that fill empty space. Not interactive ── */
  .is-example { opacity: .3; pointer-events: none; user-select: none; }
  .pk-examples { display: flex; flex-direction: column; gap: 12px; }
  .pk-examples .pk-kicker { margin: 0 2px; }

  /* ── PACKS: a shelf of records. Discs spin on hover, cards rise in ── */
  .pk-featured {
    display: flex; align-items: center; gap: 20px;
    width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--carbon);
    border: 1px solid var(--graphite); border-radius: 16px;
    padding: 18px;
    transition: transform .2s, border-color .2s;
    animation: rise .6s cubic-bezier(.2, .7, .2, 1) both;
  }
  .pk-featured:hover { transform: translateY(-2px); border-color: var(--smoke); }
  .pk-featured-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pk-kicker { font-family: var(--mono); font-size: 11px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  .pk-name { font-size: 16px; font-weight: 510; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pk-featured .pk-name { font-size: 20px; letter-spacing: -0.016em; white-space: normal; }
  .pk-host { font-family: var(--mono); font-size: 11px; color: var(--ash); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pk-art {
    width: 76px; height: 76px; flex: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--graphite), var(--obsidian));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 14%; overflow: hidden;
  }
  /* Every pack cover is the CreditCrate C-and-dot logo. It scales with the cover. */
  .pk-art-logo { display: block; width: 60%; height: auto; flex: none; }
  .pk-art-large { width: 124px; height: 124px; border-radius: 16px; }
  .pk-grid { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .pk-grid li { min-width: 0; animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 60ms); }
  .pk-card {
    display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    width: 100%; padding: 14px; text-align: left; cursor: pointer; color: inherit;
    background: var(--carbon);
    border: 1px solid var(--graphite); border-radius: 14px;
    transition: transform .2s, border-color .2s;
  }
  .pk-card:hover { transform: translateY(-2px); border-color: var(--smoke); }
  .pk-card .pk-art { width: 100%; height: auto; aspect-ratio: 1; }
  .pk-card .pk-name, .pk-card .pk-host { padding: 0 2px; }
  @media (max-width: 480px) {
    .pk-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cc-trace, .cc-eq span, .cc-head::before, .cc-head::after, .cc-eyebrow::after, .pk-grid li, .pk-featured, .cc-brand-row { animation: none !important; }
  }

  /* ── HOME: the apps are the dashboard. Previews expand in place ── */
  .dash-strip {
    grid-column: 1 / -1;
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
    gap: 20px; padding: 4px 4px 8px;
    animation: rise .6s cubic-bezier(.2, .7, .2, 1) both;
  }
  .dash-date { font-family: var(--mono); font-size: 12px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  .dash-greeting { margin-top: 6px; font-size: 28px; font-weight: 510; letter-spacing: -0.02em; color: var(--paper); }
  .dash-figures { display: flex; gap: 32px; flex-wrap: wrap; }
  .dash-figure { display: flex; flex-direction: column; align-items: flex-end; }
  .dash-figure dt { font-size: 12px; color: var(--fog); }
  .dash-figure dd { font-size: 28px; font-weight: 510; color: var(--paper); font-variant-numeric: tabular-nums; }
  .app-window-toggle {
    margin-left: auto;
    font-family: var(--sans); font-size: 12px; color: var(--fog);
    background: none; border: 1px solid var(--graphite); border-radius: 999px;
    padding: 4px 12px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .app-window-toggle:hover { color: var(--paper); border-color: var(--smoke); }
  .app-window:not(.is-open) .app-window-body {
    max-height: 520px; overflow: hidden;
  }
  .app-window:not(.is-open) .app-window-body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
    background: linear-gradient(180deg, transparent, var(--carbon));
    pointer-events: none;
  }
  .app-window.is-open { grid-column: 1 / -1; }
  .app-window-wide { grid-column: auto; }

  /* ── PACK PICKER: searchable attach-a-pack field for campaigns ── */
  .picker { display: flex; flex-direction: column; gap: 8px; }
  .picker-field { position: relative; }
  .picker-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 5;
    list-style: none; max-height: 260px; overflow-y: auto;
    background: var(--obsidian); border: 1px solid var(--smoke); border-radius: 10px;
    padding: 4px;
    box-shadow: 0 16px 40px -16px rgba(0, 0, 0, .7);
  }
  .picker-list button {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: none; border: 0; cursor: pointer;
    font-family: var(--sans); font-size: 14px; color: var(--mist); text-align: left;
  }
  .picker-list button:hover, .picker-list button:focus-visible { background: rgba(255, 255, 255, .05); color: var(--paper); }
  .picker-list small { font-family: var(--mono); font-size: 11px; color: var(--ash); white-space: nowrap; }
  .picker-empty { padding: 10px 12px; font-size: 13px; color: var(--ash); }
  .picker-current { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--fog); }

  /* ── LANDING BACKDROP: Deal Desk's drifting grid ── */
  .page:not(.signed-in)::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(208, 214, 224, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(208, 214, 224, .035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 80%);
    animation: drift 12s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .page:not(.signed-in)::before { animation: none; } }

  /* ── MINI CREDITS: the How-it-works demo in miniature, for the landing feature card ── */
  .fx-mini {
    flex-direction: column; align-items: stretch; justify-content: center; gap: 7px;
    height: auto; min-height: 156px; padding: 14px;
  }
  .mini-bar { display: flex; gap: 6px; }
  .mini-input {
    flex: 1; min-width: 0; height: 24px; padding: 0 8px;
    display: flex; align-items: center;
    border: 1px solid var(--smoke); border-radius: 6px;
    background: rgba(255, 255, 255, .02);
    font-size: 11px; color: var(--mist); white-space: nowrap; overflow: hidden;
  }
  .mini-ph { color: var(--ash); }
  .mini-caret { width: 1px; height: 12px; margin-left: 2px; background: var(--mist); animation: blink 1s steps(1) infinite; }
  .mini-btn {
    height: 24px; padding: 0 10px; border-radius: 6px;
    display: flex; align-items: center;
    background: var(--graphite); color: var(--fog); font-size: 11px;
    transition: background-color .2s, color .2s;
  }
  .mini-btn.pressed { background: var(--paper); color: var(--void); }
  .mini-album {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--paper);
    opacity: 0; transform: translateY(4px);
    transition: opacity .4s, transform .4s;
  }
  .mini-album.in { opacity: 1; transform: none; }
  .mini-cover { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, var(--smoke), var(--graphite)); flex: none; }
  .mini-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; opacity: 0; transition: opacity .4s;
  }
  .mini-row.in { opacity: 1; }
  .mini-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mist); }
  .mini-found { font-family: var(--mono); font-size: 10px; color: var(--fog); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .mini-caret { animation: none; } }

  /* ── APP GALLERY: the apps side by side like pictures. Swipe or drag left and right ── */
  .app-main { display: flex; flex-direction: column; align-items: stretch; gap: 24px; }
  .deck { display: flex; flex-direction: column; gap: 18px; }
  .deck-stage {
    display: flex; align-items: flex-start; gap: 32px;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    padding: 8px 7% 12px;
    scrollbar-width: none;
    outline: none;
    cursor: grab;
  }
  .deck-stage::-webkit-scrollbar { display: none; }
  .deck-stage.dragging { scroll-snap-type: none; cursor: grabbing; }
  .deck-stage:focus-visible { box-shadow: 0 0 0 2px var(--fog); border-radius: 16px; }
  .deck-card {
    flex: 0 0 86%; min-width: 0;
    scroll-snap-align: center;
    opacity: .4; transform: scale(.96);
    transition: opacity .4s, transform .4s;
    cursor: pointer;
  }
  .deck-card.is-active { opacity: 1; transform: none; cursor: default; }
  .deck-card .app-window { margin-top: 0; }
  .deck-stage.dragging .deck-card { pointer-events: none; }
  @media (max-width: 760px) {
    .deck-card { flex-basis: 90%; }
    .deck-stage { padding: 8px 5% 12px; }
  }
  .deck-controls { display: flex; align-items: center; gap: 14px; }
  .deck-name { flex: 1; min-width: 0; font-size: 13px; color: var(--fog); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck-arrow {
    width: 40px; height: 40px; border-radius: 999px; flex: none;
    background: none; border: 1px solid var(--graphite); color: var(--mist);
    font-size: 16px; cursor: pointer;
    transition: color .15s, border-color .15s, opacity .15s;
  }
  .deck-arrow:hover:not(:disabled) { color: var(--paper); border-color: var(--smoke); }
  .deck-arrow:disabled { opacity: .3; cursor: default; }
  .deck-dots { display: flex; align-items: center; gap: 8px; }
  .deck-dot {
    width: 8px; height: 8px; padding: 0; border: 0; border-radius: 999px;
    background: var(--smoke); cursor: pointer;
    transition: width .3s, background-color .3s;
  }
  .deck-dot[aria-current="true"] { width: 24px; background: var(--paper); }
  @media (prefers-reduced-motion: reduce) {
    .deck-card { transition: none; }
  }

  /* ── GALLERY FRAMES: every app is the same size and frame; content scrolls inside ── */
  .deck-card .app-window {
    height: 1000px; margin-top: 0;
    display: flex; flex-direction: column;
  }
  .deck-card .app-window-body {
    flex: 1; min-height: 0; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--smoke) transparent;
  }
  .deck-card .app-window:not(.is-open) .app-window-body { max-height: none; overflow-y: auto; }
  .deck-card .app-window:not(.is-open) .app-window-body::after { display: none; }
  .deck-card .app-window-toggle { display: none; }
  .deck-card .tool-frame { height: 860px; min-height: 0; }
  .pk-examples .pk-card { flex-direction: row; align-items: center; gap: 14px; padding: 10px 14px; }
  .pk-examples .pk-card .pk-art { width: 44px; height: 44px; aspect-ratio: auto; border-radius: 10px; flex: none; }
  .pk-examples .pk-card .pk-name { flex: 1; min-width: 0; }

  /* ── CAMPAIGNS: Gmail connection, activity and send progress ── */
  .gmail-card { gap: 14px; }
  .gmail-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .gmail-title { font-size: 15px; font-weight: 510; color: var(--paper); }
  .activity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .activity-list, .activity-top { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .activity-list li, .activity-top li { display: flex; align-items: baseline; gap: 8px; font-size: 14px; min-width: 0; }
  .activity-name { font-weight: 510; color: var(--paper); white-space: nowrap; }
  .activity-text { color: var(--fog); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-time { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ash); white-space: nowrap; }
  .activity-rank { font-family: var(--mono); font-size: 12px; color: var(--ash); width: 14px; }
  .send-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 760px) { .activity-grid { grid-template-columns: minmax(0, 1fr); } }

  /* ── CONTACT FILTERS ── */
  .ios-filters { display: flex; flex-direction: column; gap: 10px; }
  .ios-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .ios-chip {
    font-family: var(--sans); font-size: 13px; color: var(--fog);
    background: none; border: 1px solid var(--graphite); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
    transition: color .15s, border-color .15s, background-color .15s;
  }
  .ios-chip:hover { color: var(--paper); border-color: var(--smoke); }
  .ios-chip[aria-pressed="true"] { background: var(--paper); border-color: var(--paper); color: var(--void); }
  .rate-bar { display: flex; flex-direction: column; gap: 4px; min-width: 110px; }
  .rate-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--fog); font-variant-numeric: tabular-nums; }
  .rate-bar-track { height: 6px; border-radius: 999px; background: var(--graphite); overflow: hidden; }
  .rate-bar-track span { display: block; height: 100%; border-radius: 999px; }

  .past-campaigns { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .past-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .past-table-wrap { background: var(--carbon); border: 1px solid var(--graphite); border-radius: 12px; padding: 4px 16px; overflow-x: auto; }
  .past-row { cursor: pointer; }
  .past-row:hover td { background: rgba(255, 255, 255, .02); }
  .past-name { display: block; font-size: 14px; font-weight: 510; color: var(--paper); }
  .past-date { display: block; font-family: var(--mono); font-size: 11px; color: var(--ash); }
  .past-off { font-size: 12px; color: var(--ash); }
  .past-campaigns td { min-width: 90px; }
  .ios-album-select {
    background: var(--carbon); border: 1px solid var(--graphite); border-radius: 10px;
    color: var(--mist); font-family: var(--sans); font-size: 14px; padding: 8px 10px;
  }

  /* ── SAMPLE INBOX ── */
  /* ── SAMPLE INBOX AS CHATS: one conversation per sender, like Messages ── */
  .imsg {
    display: grid; grid-template-columns: 300px minmax(0, 1fr);
    height: 660px; min-height: 0;
    border: 1px solid var(--graphite); border-radius: 16px; overflow: hidden;
    background: var(--void);
  }
  .imsg-list { overflow-y: auto; background: var(--carbon); border-right: 1px solid var(--graphite); min-height: 0; }
  .imsg-conv {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; background: none; border: 0; border-bottom: 1px solid var(--graphite);
    color: inherit; text-align: left; cursor: pointer; font-family: var(--sans);
  }
  .imsg-conv:hover, .imsg-conv.is-active { background: var(--graphite); }
  .imsg-conv-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .imsg-conv-name { font-size: 15px; font-weight: 510; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .imsg-conv-last { font-size: 13px; color: var(--fog); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .imsg-conv-time { font-size: 12px; color: var(--ash); flex: none; align-self: flex-start; padding-top: 2px; }
  .imsg-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  }
  .imsg-avatar-sm { width: 28px; height: 28px; font-size: 11px; align-self: flex-end; }
  .imsg-avatar-lg { width: 64px; height: 64px; font-size: 22px; }
  .imsg-thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .imsg-thread-head {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 16px 16px 14px; border-bottom: 1px solid var(--graphite); background: var(--carbon);
  }
  .imsg-thread-name { font-size: 16px; font-weight: 600; color: var(--paper); }
  .imsg-thread-addr { font-size: 12px; color: var(--ash); }
  .imsg-pinned {
    display: flex; gap: 14px; padding: 14px 14px 12px;
    border-bottom: 1px solid var(--graphite);
    overflow-x: auto; scrollbar-width: none;
  }
  .imsg-pinned::-webkit-scrollbar { display: none; }
  .imsg-pin-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 64px; flex: none; padding: 0; background: none; border: 0;
    color: inherit; cursor: pointer; font-family: var(--sans);
  }
  .imsg-avatar-pin { width: 52px; height: 52px; font-size: 17px; }
  .imsg-pin-name {
    max-width: 64px; font-size: 12px; color: var(--mist);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .imsg-fav {
    margin-top: 6px; background: none; border: 1px solid var(--graphite); border-radius: 999px;
    color: var(--fog); font-family: var(--sans); font-size: 12px; padding: 4px 12px; cursor: pointer;
  }
  .imsg-fav:hover { color: var(--paper); border-color: var(--smoke); }
  .imsg-fav.is-on { color: var(--sunshine); border-color: var(--sunshine); }
  .imsg-conv-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .imsg-badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: #0a84ff; color: #ffffff;
    display: inline-grid; place-items: center;
    font-family: var(--sans); font-size: 12px; font-weight: 600; line-height: 1;
  }
  .imsg-pin-avatar { position: relative; display: inline-flex; }
  .imsg-badge-pin { position: absolute; top: -4px; right: -6px; box-shadow: 0 0 0 2px var(--carbon); }
  .imsg-badge-pack { background: var(--sunshine); color: var(--void); }
  .imsg-badge-pin-pack { top: -4px; right: auto; left: -6px; }
  .imsg-badges { display: flex; gap: 4px; }
  .imsg-back { display: none; }
  .imsg-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 4px; }
  .imsg-day { align-self: center; font-size: 12px; color: var(--ash); margin: 14px 0 8px; }
  .imsg-message { display: flex; flex-direction: column; }
  .imsg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; }
  .imsg-bubbles { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
  .imsg-bubble {
    background: var(--graphite); color: var(--paper);
    padding: 9px 14px; border-radius: 18px;
    font-size: 15px; line-height: 1.35; word-break: break-word;
  }
  .imsg-file { display: flex; flex-direction: column; gap: 2px; min-width: 240px; }
  .imsg-file-name { font-weight: 510; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imsg-file-meta { font-size: 12px; color: var(--fog); }
  .imsg-action {
    align-self: flex-start; margin-top: 6px;
    background: #0a84ff; color: #ffffff; border: 0; border-radius: 999px;
    padding: 6px 14px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .imsg-action:hover:not(:disabled) { background: #2b93ff; }
  a.imsg-action { display: inline-block; text-decoration: none; }
  a.imsg-action:hover { background: #2b93ff; }
  .imsg-action:disabled { opacity: .5; cursor: default; }
  .imsg-action-zip { margin-top: 0; }
  .imsg-link { color: var(--sky); text-decoration: none; }
  .imsg-pack { background: rgba(243, 213, 139, .12); border: 1px solid rgba(243, 213, 139, .4); }
  .imsg-pack .imsg-file-name { color: var(--sunshine); }
  .imsg-pack .imsg-action,
  .imsg-pack .imsg-action:hover { background: var(--sunshine); color: var(--void); }
  .imsg-link:hover { color: var(--paper); }
  .imsg-time { font-size: 11px; color: var(--ash); white-space: nowrap; align-self: flex-end; padding-bottom: 4px; }
  .imsg.is-example { opacity: .55; pointer-events: none; }
  @media (max-width: 760px) {
    .imsg { grid-template-columns: minmax(0, 1fr); height: 70vh; }
    .imsg-list { border-right: 0; }
    .imsg.has-chat .imsg-list { display: none; }
    .imsg:not(.has-chat) .imsg-thread { display: none; }
    .imsg-back {
      display: inline-block; align-self: flex-start; background: none; border: 0;
      color: #0a84ff; font-family: var(--sans); font-size: 15px; cursor: pointer; padding: 0;
    }
    .imsg-thread-head { position: relative; }
    .imsg-row { max-width: 94%; }
    .imsg-file { min-width: 0; }
  }

  .inbox-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .inbox-download-all { margin-top: 0; }
  .inbox-menu { position: relative; }
  .inbox-dropdown {
    width: 100%; max-height: 260px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px; padding: 6px;
    background: var(--obsidian); border: 1px solid var(--graphite); border-radius: 12px;
  }
  .inbox-dropdown > p { padding: 10px 12px; }
  .inbox-dropdown-item {
    display: flex; flex-direction: column; gap: 2px; padding: 10px 12px;
    border-radius: 8px; text-decoration: none; color: var(--paper);
  }
  .inbox-dropdown-item:hover { background: var(--graphite); }
  .inbox-dropdown-name { font-size: 14px; font-weight: 510; color: var(--sunshine); }
  .inbox-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .inbox-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .inbox-item {
    background: var(--carbon); border: 1px solid var(--graphite); border-radius: 12px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .inbox-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .inbox-subject { font-size: 15px; font-weight: 510; color: var(--paper); }
  .inbox-from { font-size: 13px; color: var(--fog); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* landing card: a mail row and a file to download */

  /* ── LANDING EXTRAS: trust strip and pricing teaser ── */

  .price-teaser {

  .price-title { margin-top: 8px; font-size: 22px; font-weight: 510; letter-spacing: -0.02em; color: var(--paper); }
  .price-copy { margin-top: 6px; font-size: 14px; color: var(--fog); }
  .price-link {
    font-size: 14px; color: var(--void); background: var(--sunshine); border-radius: 10px;

  /* ── CAMPAIGN VARIABLES ── */
  .var-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 2px; }
  .var-label { font-family: var(--mono); font-size: 11px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
  .var-chip { font-family: var(--mono); font-size: 12px; background: none; border: 1px solid var(--graphite); border-radius: 999px; color: var(--fog); padding: 4px 10px; cursor: pointer; }
  .var-chip:hover, .var-chip:focus-visible { color: var(--paper); border-color: var(--mist); outline: none; }
  .var-help { font-size: 12px; color: var(--ash); line-height: 1.5; margin: 2px 0 0; }

  /* ── AUTH: sign up and log in on the landing page ── */
  .auth { margin-top: 36px; max-width: 460px; background: var(--carbon); border: 1px solid var(--graphite); border-radius: 16px; padding: 22px; }
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 18px; }

  .auth-form { display: flex; flex-direction: column; gap: 10px; }

  .auth-sent { display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: var(--mist); }

  .auth-note { font-size: 13px; color: var(--ash); }

  .hero-copy { margin-top: 20px; font-size: 18px; color: var(--fog); max-width: 56ch; }

  /* ── FOOTER ── */
  .site-footer { margin-top: 96px; border-top: 1px solid var(--graphite); padding-top: 24px; }
  .site-footer-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--ash); }

  .demo { position: relative; }
  .demo::before {
    content: "";

  .caret {

  .demo-btn {

  .demo-album {

  .demo-name { display: flex; align-items: center; gap: 8px; color: var(--paper); font-weight: 510; }
  .demo-avatar {
    display: block; width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;

  .demo-handle { font-family: var(--mono); font-size: 12px; color: var(--ash); transition: color .3s; }
  .demo-handle.found { color: var(--mist); }

  .demo-controls { position: relative; display: flex; justify-content: flex-end; margin-top: 10px; }

  @media (max-width: 900px) {

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .search-row { flex-direction: column; align-items: stretch; }
    .how-steps { grid-template-columns: 1fr; }
    .search-input-artist { max-width: none; }
    .search-btn { justify-content: center; height: 52px; }
  }

  @media (max-width: 900px) {
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .header-actions { align-items: flex-start; }
    .tagline { text-align: left; }

    .credits-table, .credits-table tbody { display: block; width: 100%; }
    .credits-table thead {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }
    .credits-table tr.credit-row { display: grid; grid-template-columns: 1fr; gap: 0; margin-bottom: 12px; }
    .credits-table td, .credits-table th.cell-name { display: block; width: auto; }
    .credit-row > * { border: 1px solid var(--graphite); border-radius: 0 !important; margin-top: -1px; }
    .credit-row > :first-child { border-radius: 12px 12px 0 0 !important; }
    .credit-row > :last-child { border-radius: 0 0 12px 12px !important; }
    .cell[data-label]::before {
      content: attr(data-label);
      display: block;
      font-size: 11px;
      color: var(--ash);
      margin-bottom: 6px;
    }
  }

  @media (max-width: 600px) {
    .page { padding: 0 16px 64px; }
    header { padding: 32px 0 24px; margin-bottom: 32px; }
    .step-indicator { flex-direction: column; }
    .step { border-right: none; border-bottom: 1px solid var(--graphite); }
    .step:last-child { border-bottom: none; }
    .export-btn { margin-left: 0; }
  }

  /* ── HEADER MOTION ── */
  @keyframes drift { to { background-position: 48px 48px; } }
  @keyframes line-sweep { to { background-position: 200% 0; } }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(163, 221, 194, .55); }
    100% { box-shadow: 0 0 0 8px rgba(163, 221, 194, 0); }
  }

  /* Grid backdrop that slowly drifts */
  body { position: relative; }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(208, 214, 224, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(208, 214, 224, .035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 80%);
    animation: drift 12s linear infinite;
  }

  /* Header: entrance and animated hairline */
  header { position: relative; animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }
  header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--paper), transparent) 0 0 / 200% 100%;
    opacity: .35;
    animation: line-sweep 5s linear infinite;
  }

  /* Equalizer beside the logo */
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 22px; margin-left: 6px; }
  .eq span {
    width: 3px;
    height: 100%;
    border-radius: 2px;
    background: var(--fog);
    transform-origin: bottom;
    animation: eq 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(2) { animation-delay: -.3s; }
  .eq span:nth-child(3) { animation-delay: -.6s; }
  .eq span:nth-child(4) { animation-delay: -.2s; }
  .eq span:nth-child(5) { animation-delay: -.8s; }

  /* Live service status from /api/health */
  .header-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ash);
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ash); }
  .status-dot.online { background: var(--mint); animation: ping 2s ease-out infinite; }
  .status-dot.offline { background: var(--salmon); }

  @media (prefers-reduced-motion: reduce) {
    body::before, header, header::after, .eq span, .status-dot.online { animation: none !important; }
  }

  /* Pointer-coarse devices (touch): meet the 44px target guideline */
  @media (pointer: coarse) {
    .filter-btn, .export-btn, .back-btn, .email-copy, .search-btn { min-height: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .credit-row, .explainer > *, .caret { animation: none; }
    .fade, .demo-album { transition: none; }
    .spinner { animation-duration: 2s; }

</style>

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, Children, isValidElement } = React;

const API = "https://api.creditcrate.app/api";
// Dropbox Chooser app key (public, not a secret). Leave empty to hide the "Choose from Dropbox" button.
// The Dropbox app must list creditcrate.app (and localhost for testing) as allowed domains.
const DROPBOX_APP_KEY = "csr2fh4ot0x0h7v";
const ROLE_FILTERS = ["ALL", "PRODUCER", "ENGINEER", "MIXER", "WRITER"];
const STEPS = [["1", "Search album"], ["2", "Select album"], ["3", "View credits"]];

// ── Helpers ─────────────────────────────────────────────────────────────────

function roleClass(role) {
  const r = role.toLowerCase();
  if (r.includes("producer") || r.includes("executive producer")) return "producer";
  if (r.includes("engineer") || r.includes("record")) return "engineer";
  if (r.includes("mix")) return "mixer";
  if (r.includes("writ") || r.includes("compos")) return "writer";
  return "";
}

function filterLabel(f) {
  return f[0] + f.slice(1).toLowerCase();
}

// Writes one query param, keeping the others. replaceState keeps the Back button untouched.
function setUrlParam(key, value) {
  const params = new URLSearchParams(window.location.search);
  if (value) params.set(key, value);
  else params.delete(key);
  const qs = params.toString();
  window.history.replaceState(null, "", qs ? `?${qs}` : window.location.pathname);
}

function csvExport(credits, albumName) {
  const rows = [["Name","Roles","Songs","Instagram","Email","Email source"]];
  for (const c of credits) {
    rows.push([
      c.name,
      c.roles.join(" / "),
      c.songs.map(s => s.title).join(" | "),
      c.instagram_handle ? `@${c.instagram_handle}` : "",
      c.instagram_data?.email || "",
      c.instagram_data?.source_url || c.instagram_data?.source || "",
    ]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const safeName = albumName.replace(/[^\w\- ]+/g, "").trim() || "credits";
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeName}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Components ───────────────────────────────────────────────────────────────

function RoleTag({ role }) {
  return <span className={`role-tag ${roleClass(role)}`}>{role}</span>;
}

function CreditRow({ credit, delay, album, token }) {
  const [copyState, setCopyState] = useState(null); // null | "copied" | "failed"
  const [contactState, setContactState] = useState(null); // null | "saving" | "added" | "failed"
  const email = credit.instagram_data?.email;
  const songTitles = credit.songs.map(s => s.title).join(", ");

  async function copyEmail() {
    try {
      await navigator.clipboard.writeText(email);
      setCopyState("copied");
    } catch {
      setCopyState("failed");
    }
    setTimeout(() => setCopyState(null), 1500);
  }

  const copyLabel = copyState === "copied" ? "Copied" : copyState === "failed" ? "Failed" : "Copy";

  async function addToContacts() {
    setContactState("saving");
    try {
      const res = await fetch(`${API}/contacts/bulk`, {
        method: "POST",
        headers: { ...authHeaders(token), "Content-Type": "application/json" },
        body: JSON.stringify({
          source: "credits",
          album,
          contacts: [{ email, name: credit.name, instagram: credit.instagram_handle || "", roles: (credit.roles || []).join(", ") }],
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.saved !== 1) throw new Error(data.error || "not saved");
      setContactState("added");
    } catch {
      setContactState("failed");
    }
  }

  const contactLabel = contactState === "saving" ? "Saving…" : contactState === "added" ? "In Contacts" : contactState === "failed" ? "Try again" : "Add to Contacts";
  const trackCount = credit.songs.length;

  return (
    <tr className="credit-row" style={{ animationDelay: `${delay}ms` }}>
      <th scope="row" className="cell cell-name">{credit.name}</th>
      <td className="cell" data-label="Roles">
        <div className="role-list">
          {credit.roles.map(r => <RoleTag key={r} role={r} />)}
        </div>
      </td>
      <td className="cell" data-label="Tracks" title={songTitles}>
        <span className="songs-count">
          <strong>{trackCount}</strong> track{trackCount !== 1 ? "s" : ""}
        </span>
      </td>
      <td className="cell" data-label="Instagram">
        {credit.instagram_handle ? (
          <a
            className="ig-link"
            href={`https://instagram.com/${credit.instagram_handle}`}
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg className="ig-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
            @{credit.instagram_handle}
          </a>
        ) : (
          <span className="muted-dash">—</span>
        )}
      </td>
      <td className="cell" data-label="Email">
        {email ? (
          <div className="email-cell">
            <span className="email-val" title={credit.instagram_data?.source ? `Found via ${credit.instagram_data.source}` : undefined}>{email}</span>
            <button
              type="button"
              className="email-copy"
              onClick={copyEmail}
              aria-label={`Copy email for ${credit.name}`}
            >
              {copyLabel}
            </button>
            <button
              type="button"
              className="email-copy"
              onClick={addToContacts}
              disabled={contactState === "saving" || contactState === "added"}
              aria-label={`Add ${credit.name} to Contacts`}
            >
              {contactLabel}
            </button>
          </div>
        ) : (
          <span className="email-val none">
            {credit.instagram_data?.error ? "lookup failed" : credit.instagram_data ? "not found" : "no socials"}
          </span>
        )}
      </td>
    </tr>
  );
}

function prefersReducedMotion() {
  return window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;
}

// ── Accounts: the search tool is for signed-in users only ───────────────────

const TOKEN_KEY = "creditcrate-token";
const SESSION_EXPIRED = "Your session has expired. Sign in again.";

// Kept per browser so a reload doesn't sign you out. Storage can be blocked, so every access is guarded.
function readToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}
function storeToken(value) {
  try {
    if (value) localStorage.setItem(TOKEN_KEY, value);
    else localStorage.removeItem(TOKEN_KEY);
  } catch { /* blocked: the token lives in memory until the next reload */ }
}
function authHeaders(token) {
  return { Authorization: `Bearer ${token}` };
}

function LoginForm({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [unverified, setUnverified] = useState(false);
  const [resent, setResent] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setBusy(true);
    setError(null);
    setUnverified(false);
    setResent(false);
    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.code === "unverified") {
        setUnverified(true);
        throw new Error(data.error);
      }
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
      onSignedIn(data.token);
    } catch (err) {
      setError(err.message);
      setBusy(false);
    }
  }

  async function resend() {
    setResent(true);
    try {
      await fetch(`${API}/verify/resend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },

// Calls the hub API. A 401 is flagged so the page can sign the user out.
async function callApi(path, token, { method = "GET", body, form } = {}) {
  const init = { method, headers: authHeaders(token) };
  if (form) {
    init.body = form;
  } else if (body !== undefined) {
    init.headers = { ...init.headers, "Content-Type": "application/json" };
    init.body = JSON.stringify(body);
  }
  const res = await fetch(`${API}${path}`, init);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    const err = new Error(SESSION_EXPIRED);
    err.expired = true;
    throw err;
  }
  if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
  return data;
}
