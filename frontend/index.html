<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Search an album and see every producer, engineer and mixer behind it, with their Instagram and public contact email." />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#08090a" />
<title>CreditCrate — Album Production Lookup</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    /* Surfaces */
    --void: #08090a;
    --carbon: #0f1011;
    --obsidian: #161718;
    --graphite: #23252a;
    --smoke: #383b3f;
    /* Text */
    --ash: #62666d;
    --fog: #8a8f98;
    --mist: #d0d6e0;
    --paper: #ffffff;
    /* Accents: acid lime is reserved for the single primary action */
    --acid: #e4f222;
    --pulse: #27a644;
    --coral: #eb5757;
    --teal: #02b8cc;
    --iris: #6366f1;
    --lavender: #8b5cf6;

    --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--mist);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.011em;
    font-feature-settings: "cv01", "ss03", "zero";
  }

  #root { min-height: 100vh; }

  a, button, input { touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .skip-link {
    position: absolute; top: -100px; left: 16px; z-index: 10;
    background: var(--acid); color: var(--void); font-size: 13px; font-weight: 510;
    padding: 8px 12px; border-radius: 6px; text-decoration: none;
  }
  .skip-link:focus { top: 16px; }

  /* ── LAYOUT ── */
  .page { max-width: 1200px; margin: 0 auto; padding: 0 24px 96px; }

  /* ── HEADER ── */
  header {
    padding: 56px 0 32px;
    border-bottom: 1px solid var(--graphite);
    margin-bottom: 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 510;
    font-size: clamp(32px, 4.5vw, 44px);
    letter-spacing: -0.022em;
    line-height: 1;
    color: var(--paper);
  }
  .brand-mark { display: block; width: clamp(44px, 5vw, 56px); height: auto; }
  .header-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .tagline {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ash);
    text-align: right;
    line-height: 1.6;
  }

  /* ── STEP INDICATORS ── */
  .step-indicator {
    list-style: none;
    display: flex;
    margin-bottom: 32px;
    border: 1px solid var(--graphite);
    border-radius: 12px;
    overflow: hidden;
  }
  .step {
    flex: 1;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--ash);
    border-right: 1px solid var(--graphite);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step:last-child { border-right: none; }
  .step.active { color: var(--paper); }
  .step.done { color: var(--mist); }
  .step-num {
    width: 18px; height: 18px;
    border: 1px solid currentColor;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }

  /* ── SEARCH BAR ── */
  .search-block { margin-bottom: 48px; }
  .search-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .search-input-wrap { position: relative; flex: 1; }
  .search-input-artist { max-width: 260px; }
  .search-label {
    display: block;
    font-size: 13px;
    color: var(--fog);
    margin-bottom: 8px;
  }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    color: var(--mist);
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: -0.011em;
    padding: 12px 14px;
    transition: border-color .15s;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus { border-color: var(--mist); }
  input[type="text"]::placeholder, input[type="email"]::placeholder { color: var(--ash); }

  .search-btn {
    display: flex; align-items: center; gap: 10px;
    height: 48px;
    background: var(--acid);
    color: var(--void);
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 510;
    letter-spacing: -0.011em;
    padding: 0 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: filter .15s;
  }
  .search-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .search-btn .spinner { border-color: rgba(0, 0, 0, 0.25); border-top-color: var(--void); }

  /* ── ALBUM RESULTS ── */
  .album-results {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
  }
  .album-card {
    display: block;
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 12px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s;
  }
  .album-card:hover { border-color: var(--smoke); }
  .album-cover {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--obsidian);
  }
  .album-cover-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: var(--obsidian);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--ash);
  }
  .album-info { display: block; padding: 12px 16px 16px; }
  .album-name {
    display: block;
    font-size: 15px;
    font-weight: 510;
    letter-spacing: -0.011em;
    color: var(--paper);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .album-artist { display: block; font-size: 13px; color: var(--fog); }

  /* ── CREDITS ── */
  .credits-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .credits-title {
    font-size: 32px;
    font-weight: 510;
    letter-spacing: -0.022em;
    line-height: 1.13;
    color: var(--paper);
  }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn, .export-btn, .back-btn, .email-copy, .demo-toggle {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: -0.011em;
    background: transparent;
    border: 1px solid var(--graphite);
    border-radius: 6px;
    color: var(--mist);
    padding: 6px 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background-color .15s;
  }
  .filter-btn:hover, .export-btn:hover:not(:disabled), .back-btn:hover:not(:disabled), .email-copy:hover, .demo-toggle:hover {
    border-color: var(--smoke);
    color: var(--paper);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--obsidian);
    border-color: var(--smoke);
    color: var(--paper);
  }
  .export-btn { margin-left: auto; }
  .export-btn:disabled, .back-btn:disabled { opacity: .4; cursor: not-allowed; }
  .back-btn { color: var(--fog); }

  .table-wrap { overflow-x: auto; }
  .credits-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0 4px;
    text-align: left;
  }
  .credits-table th:nth-child(1) { width: 200px; }
  .credits-table th:nth-child(3) { width: 130px; }
  .credits-table th:nth-child(4) { width: 200px; }
  .credits-table th:nth-child(5) { width: 260px; }
  .credits-table thead th {
    font-size: 12px;
    font-weight: 400;
    color: var(--ash);
    padding: 0 16px 8px;
  }

  .credit-row { animation: fadeIn .3s ease both; }
  .credit-row > * {
    background: var(--carbon);
    border-top: 1px solid var(--graphite);
    border-bottom: 1px solid var(--graphite);
    transition: background-color .15s;
  }
  .credit-row > :first-child { border-left: 1px solid var(--graphite); border-radius: 12px 0 0 12px; }
  .credit-row > :last-child { border-right: 1px solid var(--graphite); border-radius: 0 12px 12px 0; }
  .credit-row:hover > * { background: var(--obsidian); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cell {
    padding: 12px 16px;
    font-size: 13px;
    vertical-align: middle;
    overflow: hidden;
  }
  .cell-name { font-size: 14px; font-weight: 510; color: var(--paper); }
  .role-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .role-tag {
    font-size: 12px;
    line-height: 20px;
    padding: 0 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--fog);
    white-space: nowrap;
  }
  .role-tag.producer { color: var(--pulse); background: rgba(39, 166, 68, 0.12); }
  .role-tag.engineer { color: var(--lavender); background: rgba(139, 92, 246, 0.12); }
  .role-tag.mixer    { color: var(--iris); background: rgba(99, 102, 241, 0.12); }
  .role-tag.writer   { color: var(--teal); background: rgba(2, 184, 204, 0.12); }

  .ig-link {
    color: var(--mist);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ig-link:hover { color: var(--paper); text-decoration: underline; }
  .ig-icon { flex-shrink: 0; }

  .email-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .email-val {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--mist);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .email-val.none { color: var(--ash); font-family: var(--sans); font-style: italic; }
  .email-copy { padding: 2px 8px; font-size: 12px; flex-shrink: 0; }

  .muted-dash { color: var(--ash); font-family: var(--mono); font-size: 12px; }

  .songs-count { font-size: 13px; color: var(--fog); font-variant-numeric: tabular-nums; }
  .songs-count strong { color: var(--mist); font-weight: 510; }

  .inline-empty { font-size: 14px; color: var(--fog); padding: 24px 0; }
  .inline-empty button { margin-left: 8px; }

  /* ── STATUS / LOADER ── */
  .status-bar {
    font-size: 13px;
    color: var(--fog);
    padding: 16px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--graphite);
    border-top-color: var(--mist);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(235, 87, 87, 0.08);
    border: 1px solid rgba(235, 87, 87, 0.4);
    border-radius: 6px;
    color: var(--coral);
    font-size: 13px;
    padding: 12px 16px;
    margin: 16px 0;
  }

  .empty-state {
    text-align: center;
    padding: 96px 0;
    color: var(--fog);
    font-size: 14px;
    text-wrap: balance;
  }
  .empty-state .big { display: block; font-size: 48px; font-weight: 510; color: var(--smoke); margin-bottom: 16px; }
  .empty-state .back-btn { margin-top: 20px; }

  /* ── EXPLAINER (landing) ── */
  .explainer { padding: 56px 0 0; }
  .section-title { font-size: 28px; font-weight: 510; letter-spacing: -0.02em; line-height: 1.2; color: var(--paper); }
  .how-steps {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    margin: 24px 0 40px;
  }
  .how-step .num { font-family: var(--mono); font-size: 12px; color: var(--ash); }
  .how-step-title { margin-top: 8px; font-size: 16px; font-weight: 510; color: var(--paper); }
  .how-step-desc { margin-top: 6px; font-size: 14px; color: var(--fog); }
  .explainer > * {
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--i, 0) * 120ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* ── NEWSLETTER + SIGN-IN PANELS ── */
  .panel {
    max-width: 560px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--graphite);
  }
  .panel-title { font-size: 20px; font-weight: 510; letter-spacing: -0.016em; color: var(--paper); }
  .panel-copy { margin-top: 8px; font-size: 14px; color: var(--fog); }
  .panel-form { margin-top: 20px; }

  /* ── TOOLS (title bar and tool screens) ── */
  .tool-section { margin-top: 32px; display: flex; flex-direction: column; gap: 20px; }
  .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .tool-card {
    display: flex; flex-direction: column; gap: 16px;
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 8px;
    padding: 20px;
    min-width: 0;
  }
  .tool-card-wide { max-width: 720px; }
  .tool-card-title { font-size: 15px; font-weight: 510; color: var(--paper); }
  .tool-filter { align-items: flex-end; }
  .tool-file-label { display: inline-flex; align-self: flex-start; cursor: pointer; }
  .tool-preview { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--graphite); padding-top: 16px; }
  .tool-preview p { font-size: 14px; color: var(--mist); }
  .tool-preview strong { color: var(--paper); font-weight: 510; }
  .tool-frame {
    width: 100%; height: calc(100vh - 220px); min-height: 640px;
    border: 1px solid var(--graphite); border-radius: 8px;
    background: var(--void);
  }
  textarea, select {
    width: 100%;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    color: var(--mist);
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: -0.011em;
    padding: 12px 14px;
  }
  textarea { resize: vertical; }
  select option { background: var(--obsidian); }
  textarea:focus, select:focus { outline: none; border-color: var(--mist); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data-table th {
    text-align: left; font-size: 12px; font-weight: 510; color: var(--fog);
    padding: 10px 12px; border-bottom: 1px solid var(--graphite);
  }
  .data-table td {
    padding: 12px; border-bottom: 1px solid var(--graphite);
    color: var(--mist); vertical-align: middle; overflow-wrap: anywhere;
  }
  .data-table .cell-link { color: var(--fog); }
  @media (max-width: 760px) {
    .tool-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* ── APP BAR: the tool title bar, sticky across the top once signed in ── */
  .app-bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(22, 23, 24, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--smoke);
    box-shadow: inset 0 -1px 0 rgba(228, 242, 34, 0.12);
  }
  .app-bar-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 10px 24px;
    display: flex; align-items: center; gap: 28px;
  }
  .app-bar-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 510; letter-spacing: -0.016em;
    color: var(--paper);
    white-space: nowrap;
  }
  @media (max-width: 760px) {
    .app-bar-inner { padding: 10px 16px; gap: 16px; }
    .app-bar-brand { display: none; }
  }
  .tool-nav {
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tool-nav::-webkit-scrollbar { display: none; }
  .tool-tab {
    font-family: var(--sans);
    font-size: 14px; font-weight: 510;
    letter-spacing: -0.011em;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--fog);
    padding: 8px 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, background-color .15s, border-color .15s;
  }
  .tool-tab:hover { color: var(--paper); background: var(--obsidian); }
  .tool-tab[aria-current="page"] {
    background: var(--acid);
    border-color: var(--acid);
    color: var(--void);
  }
  .tool-tab:focus-visible { outline-offset: 0; }

  /* ── DASHBOARD: cards, stat tiles and quick actions for signed-in users ── */
  .tool-section { margin-top: 40px; display: flex; flex-direction: column; gap: 20px; }
  .tool-section .table-wrap {
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 10px;
    padding: 4px 16px;
  }
  .search-block {
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 10px;
    padding: 20px;
    margin-top: 24px;
  }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .stat-tile {
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 10px;
    padding: 20px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-label { font-size: 12px; color: var(--fog); text-transform: uppercase; letter-spacing: .06em; }
  .stat-value {
    font-size: 36px; font-weight: 510; line-height: 1.1;
    letter-spacing: -0.03em; color: var(--paper);
    font-variant-numeric: tabular-nums;
  }
  .stat-hint { font-size: 13px; color: var(--ash); }
  .dash-section-title { font-size: 13px; font-weight: 510; color: var(--fog); text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .quick-action {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    text-align: left;
    background: var(--carbon);
    border: 1px solid var(--graphite);
    border-radius: 10px;
    padding: 18px;
    font-family: var(--sans);
    color: var(--mist);
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  .quick-action:hover { border-color: var(--smoke); background: var(--obsidian); }
  .quick-title { font-size: 15px; font-weight: 510; color: var(--paper); }
  .check-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fog); cursor: pointer; }
  .check-row input { width: 16px; height: 16px; accent-color: var(--acid); }
  .campaign-stats { display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--graphite); padding-top: 16px; }
  .stat-grid-compact { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .stat-grid-compact .stat-value { font-size: 28px; }
  .quick-copy { font-size: 13px; color: var(--fog); }

  /* ── HERO + SIGN-UP ── */
  .hero { padding: 40px 0 0; max-width: 760px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; }
  .hero-title {
    margin-top: 16px;
    font-size: clamp(36px, 5.5vw, 60px);
    font-weight: 510;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--paper);
    text-wrap: balance;
  }
  .hero-copy { margin-top: 20px; font-size: 18px; color: var(--fog); max-width: 56ch; }
  .signup { margin-top: 32px; max-width: 560px; }
  .signup-done { font-size: 15px; color: var(--mist); }

  /* ── FOOTER ── */
  .site-footer { margin-top: 96px; border-top: 1px solid var(--graphite); padding-top: 24px; }
  .site-footer-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--ash); }

  .demo { position: relative; }
  .demo::before {
    content: "";
    position: absolute;
    inset: 20% 0 -24%;
    background: radial-gradient(60% 50% at 50% 100%, rgba(208, 214, 224, 0.08), transparent 70%);
    pointer-events: none;

    }

  /* Grid backdrop that slowly drifts */

  header::after {

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const API = "https://api.creditcrate.app/api";
const ROLE_FILTERS = ["ALL", "PRODUCER", "ENGINEER", "MIXER", "WRITER"];
const STEPS = [["1", "Search album"], ["2", "Select album"], ["3", "View credits"]];

// ── Helpers ─────────────────────────────────────────────────────────────────

function roleClass(role) {
  const r = role.toLowerCase();
  if (r.includes("producer") || r.includes("executive producer")) return "producer";
  if (r.includes("engineer") || r.includes("record")) return "engineer";
  if (r.includes("mix")) return "mixer";
  if (r.includes("writ") || r.includes("compos")) return "writer";
  return "";
}

function filterLabel(f) {
  return f[0] + f.slice(1).toLowerCase();
}

// Writes one query param, keeping the others. replaceState keeps the Back button untouched.
function setUrlParam(key, value) {
  const params = new URLSearchParams(window.location.search);
  if (value) params.set(key, value);
  else params.delete(key);
  const qs = params.toString();
  window.history.replaceState(null, "", qs ? `?${qs}` : window.location.pathname);
}

function csvExport(credits, albumName) {
  const rows = [["Name","Roles","Songs","Instagram","Email","Email source"]];
  for (const c of credits) {
    rows.push([
      c.name,
      c.roles.join(" / "),
      c.songs.map(s => s.title).join(" | "),
      c.instagram_handle ? `@${c.instagram_handle}` : "",
      c.instagram_data?.email || "",
      c.instagram_data?.source_url || c.instagram_data?.source || "",
    ]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const safeName = albumName.replace(/[^\w\- ]+/g, "").trim() || "credits";
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeName}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Components ───────────────────────────────────────────────────────────────

function RoleTag({ role }) {
  return <span className={`role-tag ${roleClass(role)}`}>{role}</span>;
}

function CreditRow({ credit, delay }) {
  const [copyState, setCopyState] = useState(null); // null | "copied" | "failed"
  const email = credit.instagram_data?.email;
  const songTitles = credit.songs.map(s => s.title).join(", ");

  async function copyEmail() {
    try {
      await navigator.clipboard.writeText(email);
      setCopyState("copied");
    } catch {
      setCopyState("failed");
    }
    setTimeout(() => setCopyState(null), 1500);
  }

  const copyLabel = copyState === "copied" ? "Copied" : copyState === "failed" ? "Failed" : "Copy";
  const trackCount = credit.songs.length;

  return (
    <tr className="credit-row" style={{ animationDelay: `${delay}ms` }}>
      <th scope="row" className="cell cell-name">{credit.name}</th>
      <td className="cell" data-label="Roles">
        <div className="role-list">
          {credit.roles.map(r => <RoleTag key={r} role={r} />)}
        </div>
      </td>
      <td className="cell" data-label="Tracks" title={songTitles}>
        <span className="songs-count">
          <strong>{trackCount}</strong> track{trackCount !== 1 ? "s" : ""}
        </span>
      </td>
      <td className="cell" data-label="Instagram">
        {credit.instagram_handle ? (
          <a
            className="ig-link"
            href={`https://instagram.com/${credit.instagram_handle}`}
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg className="ig-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
            @{credit.instagram_handle}
          </a>
        ) : (
          <span className="muted-dash">—</span>
        )}
      </td>
      <td className="cell" data-label="Email">
        {email ? (
          <div className="email-cell">
            <span className="email-val" title={credit.instagram_data?.source ? `Found via ${credit.instagram_data.source}` : undefined}>{email}</span>
            <button
              type="button"
              className="email-copy"
              onClick={copyEmail}
              aria-label={`Copy email for ${credit.name}`}
            >
              {copyLabel}
            </button>
          </div>
        ) : (
          <span className="email-val none">
            {credit.instagram_data?.error ? "lookup failed" : credit.instagram_data ? "not found" : "no socials"}
          </span>
        )}
      </td>
    </tr>
  );
}

// ── Landing explainer: a looping demo of the tool ───────────────────────────
// Real credits from Genius. The demo only says an email was found; it never shows one.

const DEMO = {
  album: "Whisper My Name",
  artist: "Drake",
  cover: "demo/whisper-my-name.webp",
  credits: [
    { name: "OZ", role: "Producer", cls: "producer", handle: "ozmusiqe", photo: "demo/oz.webp" },
    { name: "London Cyr", role: "Producer", cls: "producer", handle: "londoncyr", photo: "demo/london-cyr.webp" },
    { name: "Nik D", role: "Producer", cls: "producer", handle: "iamnikd", photo: "demo/nik-d.webp" },
  ],
};
const DEMO_TICK = 50;
const DEMO_LOOP = 9000;
const DEMO_PHASES = [
  { start: 0, end: 1700, title: "Search an album", desc: "Type the album name, and the artist if you like." },
  { start: 1700, end: 4000, title: "See every credit", desc: "Producers, engineers and mixers across every track." },
  { start: 4000, end: DEMO_LOOP, title: "Reach out", desc: "Their Instagram and public contact email, ready to copy or export." },
];

function prefersReducedMotion() {
  return window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;
}

function Explainer() {
  const [reduced] = useState(prefersReducedMotion);
  const [t, setT] = useState(reduced ? DEMO_LOOP - DEMO_TICK : 0);
  const [playing, setPlaying] = useState(!reduced);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setT(prev => (prev + DEMO_TICK) % DEMO_LOOP), DEMO_TICK);
    return () => clearInterval(id);
  }, [playing]);

  const typedLength = Math.max(0, Math.min(DEMO.album.length, Math.floor((t - 300) / 70)));
  const typed = DEMO.album.slice(0, typedLength);
  const pressed = t >= 1450 && t < 1650;
  const albumIn = t >= 1700;
  const albumSelected = t >= 2300;
  return (
    <section className="explainer" aria-labelledby="explainer-heading">
      <h2 id="explainer-heading" className="section-title">How it works</h2>
      <ol className="how-steps">
        {DEMO_PHASES.map((p, i) => (
          <li key={p.title} className="how-step">
            <span className="num">0{i + 1}</span>
            <h3 className="how-step-title">{p.title}</h3>
            <p className="how-step-desc">{p.desc}</p>
          </li>
        ))}
      </ol>

      <div className="demo">
        <div className="demo-card" aria-hidden="true">
          <div className="demo-bar">
            <div className="demo-input">
              {typed ? <span>{typed}</span> : <span className="ph">Album name</span>}
              {!albumIn && <span className="caret" />}
            </div>
            <div className={`demo-btn ${pressed ? "pressed" : ""}`}>Search</div>
          </div>

          <div className={`demo-album fade ${albumIn ? "in" : ""} ${albumSelected ? "selected" : ""}`}>
            <img className="demo-cover" src={DEMO.cover} alt="" width="36" height="36" />
            <div>
              <div className="demo-album-name">{DEMO.album}</div>
              <div className="demo-album-artist">{DEMO.artist}</div>
            </div>
          </div>

          <div className="demo-rows">
            {DEMO.credits.map((c, i) => {
              const rowIn = t >= 2600 + i * 350;
              const found = t >= 4000 + i * 450;
              return (
                <div key={c.name} className={`demo-row fade ${rowIn ? "in" : ""}`}>
                  <span className="demo-name">
                    <img className="demo-avatar" src={c.photo} alt="" width="24" height="24" />
                    {c.name}
                  </span>
                  <span className="demo-role"><span className={`role-tag ${c.cls}`}>{c.role}</span></span>
                  <span className={`demo-handle ${found ? "found" : ""}`}>{found ? `@${c.handle}` : "looking…"}</span>
                  <span className={`demo-email ${found ? "found" : ""}`}>{found ? "✓ Email found" : "—"}</span>
                </div>
              );
            })}
          </div>
        </div>

        {!reduced && (
          <div className="demo-controls">
            <button type="button" className="demo-toggle" aria-pressed={!playing} onClick={() => setPlaying(p => !p)}>
              {playing ? "Pause demo" : "Play demo"}
            </button>
          </div>
        )}
      </div>
    </section>
  );
}

// ── Accounts: the search tool is for signed-in users only ───────────────────

const TOKEN_KEY = "creditcrate-token";
const SESSION_EXPIRED = "Your session has expired. Sign in again.";

// Kept per browser so a reload doesn't sign you out. Storage can be blocked, so every access is guarded.
function readToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}
function storeToken(value) {
  try {
    if (value) localStorage.setItem(TOKEN_KEY, value);
    else localStorage.removeItem(TOKEN_KEY);
  } catch { /* blocked: the token lives in memory until the next reload */ }
}
function authHeaders(token) {
  return { Authorization: `Bearer ${token}` };
}

function LoginForm({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function handleSubmit(e) {
    e.preventDefault();
    setBusy(true);
    setError(null);
    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
      onSignedIn(data.token);
    } catch (err) {
      setError(err.message);
      setBusy(false);
    }
  }

  return (
    <section className="panel" aria-labelledby="sign-in-heading">
      <h2 id="sign-in-heading" className="panel-title">Sign in</h2>
      <form className="search-row panel-form" onSubmit={handleSubmit}>
        <div className="search-input-wrap">
          <label className="search-label" htmlFor="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            name="email"
            autoComplete="username"
            required
            value={email}
            onChange={e => setEmail(e.target.value)}
          />
        </div>
        <div className="search-input-wrap">
          <label className="search-label" htmlFor="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            name="password"
            autoComplete="current-password"
            required
            value={password}
            onChange={e => setPassword(e.target.value)}
          />
        </div>
        <button type="submit" className="search-btn" disabled={busy} aria-busy={busy}>
          {busy && <span className="spinner" aria-hidden="true" />}
          Sign in
        </button>
      </form>
      {error && <div className="error-msg" role="alert">⚠ {error}</div>}
    </section>
  );
}

// ── Landing: newsletter sign-up until CreditCrate is released ───────────────

function NewsletterForm() {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState("idle"); // idle | sending | done | failed
  const [error, setError] = useState(null);

  async function handleSubmit(e) {
    e.preventDefault();
    setStatus("sending");
    setError(null);
    try {
      const res = await fetch(`${API}/newsletter`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
      setStatus("done");
    } catch (err) {
      setError(err.message);
      setStatus("failed");
    }
  }

  return (
    <div className="signup">
      {status === "done" ? (
        <p className="signup-done" role="status">You're on the list. We'll email you the day it's live.</p>
      ) : (
        <form className="search-row" onSubmit={handleSubmit}>
          <div className="search-input-wrap">
            <label className="search-label" htmlFor="newsletter-email">Get notified when it's live</label>
            <input
              id="newsletter-email"
              type="email"
              name="email"
              placeholder="you@example.com"
              autoComplete="email"
              enterKeyHint="send"
              required
              value={email}
              onChange={e => setEmail(e.target.value)}
            />
          </div>
          <button type="submit" className="search-btn" disabled={status === "sending"} aria-busy={status === "sending"}>
            {status === "sending" && <span className="spinner" aria-hidden="true" />}
            Notify me
          </button>
        </form>
      )}
      {error && <div className="error-msg" role="alert">⚠ {error}</div>}
    </div>
  );
}

// ── Tools: the title bar switches between these once you are signed in ─────

const TOOLS = [
  ["overview", "Overview"],
  ["credits", "Credits"],
  ["contacts", "Contacts"],
  ["packs", "Packs"],
  ["campaigns", "Campaigns"],
  ["dealdesk", "Deal Desk"],
];

// Calls the hub API. A 401 is flagged so the page can sign the user out.
async function callApi(path, token, { method = "GET", body, form } = {}) {
  const init = { method, headers: authHeaders(token) };
  if (form) {
    init.body = form;
  } else if (body !== undefined) {
    init.headers = { ...init.headers, "Content-Type": "application/json" };
    init.body = JSON.stringify(body);
  }
  const res = await fetch(`${API}${path}`, init);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    const err = new Error(SESSION_EXPIRED);
    err.expired = true;
    throw err;
  }
  if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
  return data;
}

function Field({ label, id, value, onChange, as = "input", type = "text", children, ...rest }) {
  const Control = as;
  return (
    <div className="search-input-wrap">
      <label className="search-label" htmlFor={id}>{label}</label>
      <Control
        id={id}
        type={as === "input" ? type : undefined}
        value={value}
        onChange={e => onChange(e.target.value)}
        autoComplete="off"
        spellCheck={false}
        {...rest}
      >
        {children}
      </Control>
    </div>
  );
}

function ToolMessages({ error, message }) {
  return (
    <>
      {error && <div className="error-msg" role="alert">⚠ {error}</div>}
      {message && <div className="status-bar" role="status"><span>{message}</span></div>}
    </>
  );
}

// Runs a tool's API action with shared busy and error handling
function useToolRunner(onAuthError) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function run(action) {
    setBusy(true);
    setError(null);
    try {
      await action();
    } catch (e) {
      if (e.expired) onAuthError();
      else setError(e.message);
    } finally {
      setBusy(false);
    }
  }

  return { busy, error, run };
}

function CampaignsTool({ token, onAuthError }) {

  const [stats, setStats] = useState(null);
  const [message, setMessage] = useState(null);
  const { busy, error, run } = useToolRunner(onAuthError);

  async function load() {
    const [c, p] = await Promise.all([callApi("/campaigns", token), callApi("/packs", token)]);
    setCampaigns(c.campaigns);
    setPacks(p.packs);
  }

  useEffect(() => { run(load); }, []);

  async function loadStats(id) {
    setStats(await callApi(`/campaigns/${id}/stats`, token));
  }

  useEffect(() => {
    if (selectedId) run(() => loadStats(selectedId));
    else setStats(null);
  }, [selectedId]);

  function createCampaign(e) {
    e.preventDefault();
    run(async () => {
      const data = await callApi("/campaigns", token, {
        method: "POST",
        body: { ...form, pack_id: form.pack_id ? Number(form.pack_id) : null },
      });
      setSelectedId(String(data.id));
      setForm({ name: "", subject: "", body: "Hi {{name}},\n\n", pack_id: "", track: true });
      setPreview(null);
      setMessage("Draft saved. Preview who it reaches before you send.");
      await load();
    });
  }

  function requestSend(confirm) {
    return callApi(`/campaigns/${selectedId}/send`, token, {
      method: "POST",
      body: { role: audience.role.trim(), tag: audience.tag.trim(), confirm },
    });
  }

  function previewSend() {
    run(async () => {
      setMessage(null);
      setPreview(await requestSend(false));
    });
  }

  function sendNow() {
    if (!preview || !window.confirm(`Send this campaign to ${preview.would_send} people now? This cannot be undone.`)) return;
    run(async () => {
      const result = await requestSend(true);
      setPreview(null);
      setMessage(`Sent ${result.sent}. Failed ${result.failed}. Still waiting: ${result.remaining}.`);
      await load();
      await loadStats(selectedId);

          <Field label="Subject" id="campaign-subject" value={form.subject} onChange={v => setForm(f => ({ ...f, subject: v }))} required />

          <Field label="Attach pack link" id="campaign-pack" as="select" value={form.pack_id} onChange={v => setForm(f => ({ ...f, pack_id: v }))}>
            <option value="">No pack</option>

          </Field>
          <label className="check-row">
            <input type="checkbox" checked={form.track} onChange={e => setForm(f => ({ ...f, track: e.target.checked }))} />
            <span>Track opens and clicks</span>
          </label>
          <button type="submit" className="search-btn" disabled={busy || !form.subject.trim() || !form.body.trim()}>Save draft</button>
        </form>

        <div className="tool-card">
          <h3 className="tool-card-title">Send</h3>
          <Field label="Campaign" id="campaign-select" as="select" value={selectedId} onChange={v => { setSelectedId(v); setPreview(null); }}>
            <option value="">Choose a campaign</option>
            {(campaigns || []).map(c => (
              <option key={c.id} value={c.id}>{c.name || c.subject} ({c.status})</option>
            ))}
          </Field>
          <div className="search-row">
            <Field label="Role" id="audience-role" value={audience.role} onChange={v => { setAudience(a => ({ ...a, role: v })); setPreview(null); }} />
            <Field label="Tag" id="audience-tag" value={audience.tag} onChange={v => { setAudience(a => ({ ...a, tag: v })); setPreview(null); }} />
          </div>
          <button type="button" className="back-btn" onClick={previewSend} disabled={busy || !selectedId}>Preview recipients</button>

          {preview && (
            <div className="tool-preview" role="status">
              <p>
                This would reach <strong>{preview.would_send}</strong> people.
                {preview.mode !== "resend" && " Live sending is off on this server, so nothing will be sent."}
              </p>
              {preview.sample?.length > 0 && <p className="panel-copy">Sample: {preview.sample.join(", ")}</p>}

                Send to {preview.would_send} people

            </div>
          )}
          {stats && (
            <div className="campaign-stats">
              {stats.tracking ? (
                <>
                  <div className="stat-grid stat-grid-compact">

function App() {
  const initialParams = new URLSearchParams(window.location.search);
  const initialRole = initialParams.get("role");

  const [albumQuery, setAlbumQuery] = useState(initialParams.get("q") || "");
  const [artistQuery, setArtistQuery] = useState(initialParams.get("artist") || "");
  const [searchResults, setSearchResults] = useState(null);
  const [selectedAlbum, setSelectedAlbum] = useState(null);
  const [credits, setCredits] = useState(null);
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const [error, setError] = useState(null);
  const [roleFilter, setRoleFilter] = useState(ROLE_FILTERS.includes(initialRole) ? initialRole : "ALL");
  const [token, setToken] = useState(readToken);
  const [showLogin, setShowLogin] = useState(false);
  const [tool, setTool] = useState(() => (TOOLS.some(([id]) => id === initialParams.get("tool")) ? initialParams.get("tool") : "overview"));
  const [apiStatus, setApiStatus] = useState("checking"); // checking | online | offline

  // 1=search, 2=pick album, 3=credits
  const step = selectedAlbum ? 3 : (searchResults || loading) ? 2 : 1;

  useEffect(() => {
    let cancelled = false;
    fetch(`${API}/health`)
      .then(res => { if (!cancelled) setApiStatus(res.ok ? "online" : "offline"); })
      .catch(() => { if (!cancelled) setApiStatus("offline"); });
    return () => { cancelled = true; };
  }, []);

  async function runSearch(album, artist) {
    const q = album.trim();
    if (!q) return;
    setUrlParam("q", q);
    setUrlParam("artist", artist.trim());
    setLoading(true);
    setError(null);
    setSearchResults(null);
    setCredits(null);
    setSelectedAlbum(null);
    setStatusMsg("Searching Genius…");
    try {
      const res = await fetch(`${API}/search?album=${encodeURIComponent(q)}&artist=${encodeURIComponent(artist.trim())}`, { headers: authHeaders(token) });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setSearchResults(data.results);
      if (data.results.length === 0) setStatusMsg("No albums found. Try a different query.");
      else setStatusMsg(`Found ${data.results.length} album${data.results.length !== 1 ? "s" : ""}. Pick one.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  // Re-run the search when the page was opened with ?q= in the URL
  useEffect(() => {
    if (token && albumQuery.trim()) runSearch(albumQuery, artistQuery);
  }, []);

  function handleSearch(e) {
    e.preventDefault();
    runSearch(albumQuery, artistQuery);
  }

  async function handleSelectAlbum(album) {
    setSelectedAlbum(album);
    setLoading(true);
    setError(null);
    setCredits(null);
    setStatusMsg(`Fetching track credits for "${album.name}"… this may take a minute.`);
    try {
      const res = await fetch(`${API}/album/${album.id}/credits`, { headers: authHeaders(token) });
      if (res.status === 401) return signOut(SESSION_EXPIRED);
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setCredits(data.credits);
      setStatusMsg(`Found ${data.credits.length} credited person${data.credits.length !== 1 ? "s" : ""}.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  function handleBack() {
    setSelectedAlbum(null);
    setCredits(null);
    setError(null);
    setStatusMsg(`Found ${searchResults.length} album${searchResults.length !== 1 ? "s" : ""}. Pick one.`);
  }

  function handleSignedIn(newToken) {
    storeToken(newToken);
    setToken(newToken);
    setShowLogin(false);
    setError(null);
  }

  function changeTool(id) {
    setTool(id);
    setError(null);
    setUrlParam("tool", id === "overview" ? "" : id);
  }

  function signOut(message = null) {
    storeToken("");
    setToken("");
    setTool("overview");
    setShowLogin(false);
    setSearchResults(null);
    setSelectedAlbum(null);
    setCredits(null);
    setStatusMsg("");
    setError(message);
  }

  function changeRole(role) {
    setRoleFilter(role);
    setUrlParam("role", role === "ALL" ? "" : role);
  }

  const filteredCredits = credits ? credits.filter(c => {
    if (roleFilter === "ALL") return true;
    return c.roles.some(r => roleClass(r) === roleFilter.toLowerCase());
  }) : [];

  return (
    <>
    {token && (
      <nav className="app-bar" aria-label="Tools">
        <div className="app-bar-inner">
          <span className="app-bar-brand">
            <img src="logo.svg" alt="" width="22" height="22" />
            CreditCrate
          </span>
          <div className="tool-nav">
            {TOOLS.map(([id, label]) => (
              <button key={id} type="button" className="tool-tab" aria-current={tool === id ? "page" : undefined} onClick={() => changeTool(id)}>{label}</button>
            ))}
          </div>
        </div>
      </nav>
    )}
    <div className="page">
      <header>
        <h1 className="brand">
          <img className="brand-mark" src="logo.svg" alt="" width="56" height="56" />
          CreditCrate
          <span className="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        </h1>
        <div className="header-actions">
          <div className="header-status" role="status">
            <span className={`status-dot ${apiStatus}`} aria-hidden="true"></span>
            {apiStatus === "online" ? "Service online" : apiStatus === "offline" ? "Service offline" : "Checking service…"}
          </div>
          <p className="tagline">
            Producer credits<br/>
            Public contacts
          </p>
          {token && <button type="button" className="back-btn" onClick={() => signOut()}>Sign out</button>}
        </div>
      </header>

      <main id="main">
        {error && <div className="error-msg" role="alert">⚠ {error}</div>}

        {token && tool === "credits" && <>
        <ol className="step-indicator" aria-label="Progress">
          {STEPS.map(([n, label]) => (
            <li
              key={n}
              className={`step ${step === +n ? "active" : step > +n ? "done" : ""}`}
              aria-current={step === +n ? "step" : undefined}
            >
              <span className="step-num" aria-hidden="true">{step > +n ? "✓" : n}</span>
              {label}
            </li>
          ))}
        </ol>

        <form className="search-block" role="search" onSubmit={handleSearch}>
          <div className="search-row">
            <div className="search-input-wrap">
              <label className="search-label" htmlFor="album-input">Album name</label>
              <input
                id="album-input"
                type="text"
                name="album"
                placeholder="e.g. good kid, m.A.A.d city"
                autoComplete="off"
                spellCheck={false}
                enterKeyHint="search"
                required
                value={albumQuery}
                onChange={e => setAlbumQuery(e.target.value)}
              />
            </div>
            <div className="search-input-wrap search-input-artist">
              <label className="search-label" htmlFor="artist-input">Artist (optional)</label>
              <input
                id="artist-input"
                type="text"
                name="artist"
                placeholder="e.g. Kendrick Lamar"
                autoComplete="off"
                spellCheck={false}
                enterKeyHint="search"
                value={artistQuery}
                onChange={e => setArtistQuery(e.target.value)}
              />
            </div>
            <button
              type="submit"
              className="search-btn"
              disabled={loading || !albumQuery.trim()}
              aria-busy={loading}
            >
              {loading && <span className="spinner" aria-hidden="true" />}
              Search
            </button>
          </div>
        </form>

        <div role="status" aria-live="polite">
          {(loading || statusMsg) && (
            <div className="status-bar">
              {loading && <span className="spinner" aria-hidden="true" />}
              <span>{statusMsg}</span>
            </div>
          )}
        </div>

        {searchResults && searchResults.length > 0 && !selectedAlbum && (
          <ul className="album-results">
            {searchResults.map(alb => (
              <li key={alb.id}>
                <button type="button" className="album-card" onClick={() => handleSelectAlbum(alb)}>
                  {alb.cover_art ? (
                    <img className="album-cover" src={alb.cover_art} alt="" width="220" height="220" loading="lazy" decoding="async" />
                  ) : (
                    <div className="album-cover-placeholder" aria-hidden="true">♪</div>
                  )}
                  <span className="album-info">
                    <span className="album-name">{alb.name}</span>
                    <span className="album-artist">{alb.artist}</span>
                  </span>
                </button>
              </li>
            ))}
          </ul>
        )}

        {credits && credits.length > 0 && (
          <section aria-labelledby="credits-heading">
            <div className="credits-header">
              <button type="button" className="back-btn" onClick={handleBack} disabled={loading}>← Results</button>
              <h2 id="credits-heading" className="credits-title">{selectedAlbum.name}</h2>
              <div className="filter-row" role="group" aria-label="Filter by role">
                {ROLE_FILTERS.map(f => (
                  <button
                    type="button"
                    key={f}
                    className={`filter-btn ${roleFilter === f ? "active" : ""}`}
                    aria-pressed={roleFilter === f}
                    onClick={() => changeRole(f)}
                  >
                    {filterLabel(f)}
                  </button>
                ))}
              </div>
              <button
                type="button"
                className="export-btn"
                onClick={() => csvExport(filteredCredits, selectedAlbum.name)}
                disabled={filteredCredits.length === 0}
              >
                <span aria-hidden="true">↓</span> Export CSV
              </button>
            </div>

            {filteredCredits.length === 0 ? (
              <p className="inline-empty">
                No {roleFilter.toLowerCase()} credits on this album.
                <button type="button" className="filter-btn" onClick={() => changeRole("ALL")}>Show all</button>
              </p>
            ) : (
              <div className="table-wrap">
                <table className="credits-table">
                  <caption className="sr-only">Credits for {selectedAlbum.name}</caption>
                  <thead>
                    <tr>
                      <th scope="col">Name</th>
                      <th scope="col">Roles</th>
                      <th scope="col">Tracks</th>
                      <th scope="col">Instagram</th>
                      <th scope="col">Email</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredCredits.map((c, i) => (
                      <CreditRow key={c.name} credit={c} delay={i * 30} />
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </section>
        )}

        {credits && credits.length === 0 && !loading && (
          <div className="empty-state">
            <span className="big" aria-hidden="true">∅</span>
            <p>No credits found for this album on Genius.</p>
            <button type="button" className="back-btn" onClick={handleBack}>← Back to results</button>
          </div>
        )}

        </>}

        {token && tool === "overview" && <OverviewTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} onOpen={changeTool} />}
        {token && tool === "contacts" && <ContactsTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} />}
        {token && tool === "packs" && <PacksTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} />}
        {token && tool === "campaigns" && <CampaignsTool token={token} onAuthError={() => signOut(SESSION_EXPIRED)} />}
        {token && tool === "dealdesk" && <DealDeskTool />}

        {!token && <>
          <section className="hero" aria-labelledby="hero-heading">
            <p className="eyebrow">Launching soon</p>
            <h2 id="hero-heading" className="hero-title">Know who to send your beat to.</h2>
            <p className="hero-copy">
              CreditCrate lists every producer, engineer and mixer on an album, with their Instagram
              and public contact email. Send your samples and beats to the people who made the records you love.
            </p>
            <NewsletterForm />
          </section>
          <Explainer />
        </>}
      </main>

      <footer className="site-footer">
        {!token && showLogin && <LoginForm onSignedIn={handleSignedIn} />}
        <div className="site-footer-row">
          <span>CreditCrate © 2026</span>
          {!token && (
            <button type="button" className="back-btn" aria-expanded={showLogin} onClick={() => setShowLogin(s => !s)}>
              {showLogin ? "Close" : "Member sign in"}
            </button>
          )}
        </div>
      </footer>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
