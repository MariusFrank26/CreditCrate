version: "3.8"
 
services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: creditcrate-backend
    restart: unless-stopped
    environment:
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - IG_SESSION_USERNAME=${IG_SESSION_USERNAME}
    volumes:
      - ig_session:/root/.config/instaloader   # Instagram-Session überlebt Rebuilds/Redeploys
      - ./backend/creditcrate.db:/app/creditcrate.db  # Cache-DB überlebt Rebuilds
    ports:
      - "5001:5000"
 
  frontend:
    build:
      context: ./frontend
      network: host
    container_name: creditcrate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
 
volumes:
  ig_session:
