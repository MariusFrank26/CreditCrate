version: "3.8"

services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: creditcrate-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - IG_SESSION_USERNAME=${IG_SESSION_USERNAME}
      - AUTH_SECRET=${AUTH_SECRET}
      - CREDENTIAL_KEY=${CREDENTIAL_KEY}   # Fernet key that encrypts Gmail app passwords
      - MAIL_SENDER_ADDRESS=${MAIL_SENDER_ADDRESS:-}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://api.creditcrate.app/api}
    volumes:
      - ig_session:/root/.config/instaloader   # Instagram-Session überlebt Rebuilds/Redeploys
      - cache_data:/app/data                   # Verzeichnis statt Einzeldatei - vermeidet Mount-Fehler
    # Mit network_mode: host entfällt das Port-Mapping - Flask läuft direkt auf
    # Host-Port 5000 (siehe app.run(port=5000) in app.py). Falls bisher etwas auf
    # Port 5001 zeigte (Nginx, Reverse Proxy, Frontend-API-URL), auf 5000 umstellen!

  frontend:
    build:
      context: ./frontend
      network: host
    container_name: creditcrate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"

volumes:
  ig_session:
  cache_data:
